teralizer {
  data-dir = "data"

  project {
    use-test-generation = false
    use-test-generalization = true
    use-test-reduction = true
  }

  evosuite {
    stopping-condition = "MAXTIME"
    search-budget = "60"
    assertion-strategy = "MUTATION"
    coverage-criterion = "LINE:BRANCH:EXCEPTION:WEAKMUTATION:OUTPUT:METHOD:METHODNOEXCEPTION:CBRANCH"
  }

  jpf {
    max-execution-time = 10
    max-path-condition-size = 100000
    max-search-depth = 100
  }

  junit {
    # Generalized-suite budget = min(max-execution-time * ceil(properties * tries /
    # baseline-tries-budget), max-generalized-execution-time). Slope calibrated against
    # rerun2 telemetry (~34 property-tries/s observed end to end).
    max-execution-time = 60
    baseline-tries-budget = 1600
    max-generalized-execution-time = 3600
  }

  pitest {
    mutators = "DEFAULTS"
    max-execution-time = 60
    # ORIGINAL-stage PIT mutates the full-suite coverage scope and has no analysis consumer.
    original.enabled = false
  }
}
