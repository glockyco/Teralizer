# Test-scope config defaults, merged into ConfigFactory.defaultReference() alongside the main
# reference.conf. Production runs define generalization variants in profile configs
# (project-configs/*.conf), so the main reference.conf carries no variants; tests that drive
# TestGeneralizationTask need one deterministically, independent of class-load order (a
# System.setProperty in a test only works if it runs before Configuration's static init).
teralizer {
  generalizations {
    IMPROVED_100_TRIES {
      algorithm = "IMPROVED"
      jqwik { tries = 100 }
    }
  }
}
