services:

  teralizer:
    build: .
    environment:
      PROJECT_CONFIG_PATH: "project-configs/example-maven-junit5.conf"
    ports:
      - "8000:8000"
    volumes:
      - ./docker-data/database:/app/database
      - ./docker-data/data:/app/data
    depends_on:
      - postgres
    networks:
      - teralizer-network

  postgres:
    image: postgres:17
    container_name: postgres-teralizer
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./database/teralizer:/var/lib/postgresql/data
    networks:
      - teralizer-network

  adminer:
    image: adminer
    ports:
      - "18080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_USER: postgres
      ADMINER_DEFAULT_PASSWORD: postgres
      ADMINER_DEFAULT_DB: postgres
    depends_on:
      - postgres
    networks:
      - teralizer-network

networks:
  teralizer-network:
    driver: bridge
