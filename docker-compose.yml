services:

  teralizer:
    build: .
    environment:
      - DB_HOST="postgres"
      - PROJECT_CONFIG_PATH="project-configs/example-maven-junit5.conf"
    ports:
      - "8000:8000"
    volumes:
      - ./docker-data/database:/app/database
      - ./docker-data/data:/app/data
    depends_on:
      - postgres
    networks:
      - teralizer-network

  postgres:
    image: postgres:17
    container_name: postgres-teralizer
    environment:
      - POSTGRES_DB=${DB_NAME:-postgres}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./database/teralizer:/var/lib/postgresql/data
    networks:
      - teralizer-network

  adminer:
    image: adminer
    ports:
      - "18080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
      - ADMINER_DEFAULT_DB=${DB_NAME:-postgres}
      - ADMINER_DEFAULT_USER=${DB_USER:-postgres}
      - ADMINER_DEFAULT_PASSWORD=${DB_PASSWORD:-postgres}
    depends_on:
      - postgres
    networks:
      - teralizer-network

networks:
  teralizer-network:
    driver: bridge
