services:

  teralizer:
    build: .
    environment:
      - DB_HOST="postgres"
      - PROJECT_CONFIG_PATH="project-configs/example-maven-junit5.conf"
    ports:
      - "8000:8000"
    volumes:
      - ./docker-data/database:/app/database
      - ./docker-data/data:/app/data
    depends_on:
      - postgres
    networks:
      - teralizer-network

  postgres:
    image: postgres:17
    container_name: postgres-teralizer
    environment:
      - POSTGRES_DB=${DB_NAME:-postgres}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./database/teralizer:/var/lib/postgresql/data
    networks:
      - teralizer-network

  adminer:
    image: adminer
    ports:
      - "18080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
      - ADMINER_DEFAULT_DB=${DB_NAME:-postgres}
      - ADMINER_DEFAULT_USER=${DB_USER:-postgres}
      - ADMINER_DEFAULT_PASSWORD=${DB_PASSWORD:-postgres}
    depends_on:
      - postgres
    networks:
      - teralizer-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-teralizer
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_SERVER_JSON_FILE: /var/lib/pgadmin/servers.json
    ports:
      - "18081:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json
      - ./docker/pgadmin/entrypoint.sh:/new-entrypoint.sh
      - pgadmin-data:/var/lib/pgadmin
    entrypoint: ["/new-entrypoint.sh"]
    depends_on:
      - postgres
    networks:
      - teralizer-network

networks:
  teralizer-network:
    driver: bridge

volumes:
  pgadmin-data:
