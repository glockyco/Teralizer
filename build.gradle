plugins {
    id 'java'
    id 'application'
    id 'nu.studer.jooq' version '5.2.2'
}

group = 'teralizer'
version = '1.0-SNAPSHOT'

sourceCompatibility = 1.8
targetCompatibility = 1.8

mainClassName = 'teralizer.TestGeneralizationRunner'

repositories {
    mavenCentral()
    maven { url 'https://repo.gradle.org/gradle/libs-releases' }
}

dependencies {
    def jpfCoreLibs = fileTree("${project(':jpf-core').buildDir}") { include '*.jar' }
    def jpfSymbcLibs = fileTree("${project(':jpf-symbc').buildDir}") { include '*.jar' }

    ant.importBuild 'build-properties.xml'
    def jpfCoreNativeLibs = files(ant.properties['jpf-core.native_classpath'].split(';'))
    def jpfSymbcNativeLibs = files(ant.properties['jpf-symbc.native_classpath'].split(';'))

    def libs = jpfCoreLibs + jpfCoreNativeLibs + jpfSymbcLibs + jpfSymbcNativeLibs

    implementation libs
    testImplementation libs

    implementation 'com.typesafe:config:1.4.3'
    implementation 'commons-io:commons-io:2.16.1'
    implementation 'org.postgresql:postgresql:42.7.4'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'fr.inria.gforge.spoon:spoon-core:9.1.0'
    implementation 'org.apache.velocity:velocity-engine-core:2.3'
    implementation 'org.gradle:gradle-tooling-api:8.8'
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
    implementation 'org.eclipse.jgit:org.eclipse.jgit:5.13.3.202401111512-r'
    implementation 'org.eclipse.jgit:org.eclipse.jgit.ssh.apache:5.13.3.202401111512-r'
    implementation 'org.dom4j:dom4j:2.1.4'
    implementation 'org.apache.maven.plugins:maven-surefire-report-plugin:3.5.0'

    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'ch.qos.logback:logback-classic:1.3.14'

    implementation 'junit:junit:4.13.1'
    implementation "net.jqwik:jqwik:1.8.5"

    testImplementation 'junit:junit:4.13.1'
    testImplementation "net.jqwik:jqwik:1.8.5"

    jooqGenerator 'org.postgresql:postgresql:42.7.4'
    jooqGenerator 'ch.qos.logback:logback-classic:1.3.14'
}

compileJava {
    dependsOn(':jpf-core:buildJars')
    dependsOn(':jpf-symbc:buildJars')
}

test {
    useJUnitPlatform()
}

tasks.register('startPostgres', Exec) {
    group = 'database'
    description = 'Starts PostgreSQL using Docker'

    commandLine 'docker', 'compose', 'up', '-d', 'postgres'
}

tasks.register('stopPostgres', Exec) {
    group = 'database'
    description = 'Stops PostgreSQL Docker container'

    commandLine 'docker', 'compose', 'stop', 'postgres'
}

jooq {
    configurations {
        main {
            generateSchemaSourceOnCompilation = false

            generationTool {
                jdbc {
                    driver = 'org.postgresql.Driver'
                    url = 'jdbc:postgresql://localhost:5432/postgres'
                    user = 'postgres'
                    password = 'postgres'
                }
                generator {
                    database {
                        name = 'org.jooq.meta.postgres.PostgresDatabase'
                        inputSchema = 'public'
                        forcedTypes {
                            forcedType {
                                userType = "teralizer.processing.ProjectType"
                                enumConverter = true
                                includeExpression = "project.type"
                            }
                            forcedType {
                                userType = "teralizer.processing.TestFramework"
                                enumConverter = true
                                includeExpression = "project.test_framework"
                            }
                            forcedType {
                                userType = "java.nio.file.Path"
                                converter = "teralizer.jooq.PathConverter"
                                includeExpression = "project.*_path"
                            }
                            forcedType {
                                userType = "teralizer.processing.filter.FilterDecision"
                                enumConverter = true
                                includeExpression = "filter_result.decision"
                            }
                            forcedType {
                                userType = "teralizer.processing.ProcessingStage"
                                enumConverter = true
                                includeExpression = "junit_test_report.stage"
                            }
                            forcedType {
                                userType = "teralizer.processing.TestResult"
                                enumConverter = true
                                includeExpression = "junit_test_report.result"
                            }
                            forcedType {
                                userType = "teralizer.processing.ProcessingStage"
                                enumConverter = true
                                includeExpression = "jacoco_coverage_report.stage"
                            }
                            forcedType {
                                userType = "teralizer.processing.ProcessingStage"
                                enumConverter = true
                                includeExpression = "pit_coverage_report.stage"
                            }
                            forcedType {
                                userType = "teralizer.processing.ProcessingStage"
                                enumConverter = true
                                includeExpression = "pit_mutation_report.stage"
                            }
                            forcedType {
                                userType = "teralizer.processing.MutationStatus"
                                enumConverter = true
                                includeExpression = "pit_mutation_report.status"
                            }
                            forcedType {
                                userType = "teralizer.processing.ProcessingStage"
                                enumConverter = true
                                includeExpression = "task.stage"
                            }
                            forcedType {
                                userType = "teralizer.processing.ProcessingStatus"
                                enumConverter = true
                                includeExpression = "task.status"
                            }
                        }
                    }
                }
            }
        }
    }
}

run {
    systemProperty 'teralizer.config', System.getProperty('teralizer.config')
}

jar  {
    manifest {
        attributes("Main-Class": "teralizer.TestGeneralizationRunner")
    }
}
