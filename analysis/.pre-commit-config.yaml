exclude: ^(dataset/|notebooks/legacy/)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run --directory analysis ty check src/ tests/ validate.py
        language: system
        types: [python]
        pass_filenames: false