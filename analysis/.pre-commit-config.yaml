exclude: ^(dataset/|notebooks/legacy/)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run --directory analysis ty check src/ tests/ validate.py
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest (no database)
        entry: uv run --directory analysis python -m pytest -m "not db" -q
        language: system
        types: [python]
        pass_filenames: false
      # The database tests cannot run in CI, which has no corpus, so a push is
      # the last point they can be enforced. They skip when PostgreSQL is
      # unreachable, so -ra makes a run that proved nothing say so.
      - id: pytest-db
        name: pytest (full, needs the corpus)
        entry: uv run --directory analysis python -m pytest -q -ra
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]