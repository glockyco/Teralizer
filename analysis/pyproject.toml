[project]
name = "teralizer-analysis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.3",
    "natsort>=8.4.0",
    "pandas>=2.3.0",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.1.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.41",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.5",
    "teralizer-analysis",
    "ty>=0.0.1a16",
]

[tool.uv.sources]
teralizer-analysis = { workspace = true }

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
# Coverage is a reporting concern and triples the inner loop, so CI asks for it.
markers = [
    "db: needs a populated PostgreSQL corpus, and skips when it is unreachable",
]

# Generated report artifacts mirror already-checked source; don't type-check them.
[tool.ty.src]
exclude = ["output"]
