# Git hooks managed by lefthook. The devshell installs them automatically.
#
# The dispatcher uses native uv on Windows and the absolute system Nix on
# Mac/Linux, including editor clients without a toolchain on PATH. Every job
# uses frozen resolution, so analysis/uv.lock owns Python tool versions.

assert_lefthook_installed: true

pre-commit:
  # Every Python job uses analysis/.venv. Serial execution prevents concurrent
  # uv processes from replacing that environment on a clean checkout.
  parallel: false
  jobs:
    - name: corpus-source-boundary
      run: sh scripts/hook-uv.sh --directory analysis python -m teralizer.corpus_literal_check
    - name: verification-corpus-contract
      run: sh scripts/hook-uv.sh --directory analysis python -m teralizer.verification_corpus_contract
    - name: ruff-format
      root: analysis/
      glob: "**/*.py"
      run: sh ../scripts/hook-uv.sh ruff format {staged_files}
      stage_fixed: true
    - name: ruff-lint
      root: analysis/
      glob: "**/*.py"
      run: sh ../scripts/hook-uv.sh ruff check --fix {staged_files}
      stage_fixed: true
    - name: ty
      root: analysis/
      glob: "**/*.py"
      run: sh ../scripts/hook-uv.sh ty check {staged_files}

pre-push:
  jobs:
    # The database tests need the corpus, which CI does not have, so a push is the
    # last point they run. They skip when PostgreSQL is unreachable, and -ra makes
    # a run that proved nothing say so.
    - name: pytest
      root: analysis/
      run: sh ../scripts/hook-uv.sh python -m pytest -q -ra
