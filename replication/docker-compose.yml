# Replication package Docker composition for Teralizer.
#
# Services:
#   postgres  - PostgreSQL 17.10, the version that wrote the corpus dumps (port 5432)
#   adminer   - Database web UI (port 18080)
#   teralizer - Java pipeline for data collection (on-demand)
#   analysis  - Reports and release checks on the mounted release (on-demand)
#
# The root ./artifact command runs these services for every reviewer workflow.

# The default project name, so that every command in this workspace addresses the
# same services and volumes. COMPOSE_PROJECT_NAME overrides it.
name: teralizer

services:
  postgres:
    image: postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
    shm_size: 512m
    environment:
      POSTGRES_USER: ${REPLICATION_DB_USER:-teralizer}
      POSTGRES_PASSWORD: ${REPLICATION_DB_PASSWORD:-teralizer}
    # Tuning for bulk imports and analysis queries
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - work_mem=64MB
      - -c
      - max_wal_size=4GB
      - -c
      - min_wal_size=1GB
      - -c
      - wal_buffers=64MB
      - -c
      - checkpoint_timeout=30min
      - -c
      - checkpoint_completion_target=0.9
    # No host port: the other services reach the database by its service name,
    # so a host PostgreSQL or a second workspace does not collide with it.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REPLICATION_DB_USER:-teralizer}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G

  adminer:
    image: adminer:4.8.1@sha256:34d37131366c5aa84e1693dbed48593ed6f95fb450b576c1a7a59d3a9c9e8802
    ports:
      - "127.0.0.1:${REPLICATION_ADMINER_PORT:-18080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  teralizer:
    build:
      context: ..
      dockerfile: Dockerfile
    platform: linux/amd64
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${REPLICATION_DB_USER:-teralizer}
      DB_PASSWORD: ${REPLICATION_DB_PASSWORD:-teralizer}
      DATA_DIR: /app/data
    volumes:
      # Packaged runs mount disposable working copies instead of checkout projects and data.
      - ${TERALIZER_COLLECT_PROJECTS:-../projects}:/app/projects
      - ${TERALIZER_COLLECT_DATA:-teralizer-data}:/app/data
      - ../project-configs:/app/project-configs:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 8G

  # The release root is mounted read-only, so the reports run on the extracted
  # files and cannot change them. Runs write only to /output and /state, which
  # must exist before the run so that Docker does not create them as root.
  # The service holds only the report role's credentials, which can read the
  # prepared corpora and nothing else.
  analysis:
    build:
      context: ../analysis
      dockerfile: ../replication/Dockerfile.analysis
    user: "${TERALIZER_UID:-1000}:${TERALIZER_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REPORT_DB_USER: ${REPLICATION_REPORT_DB_USER:-teralizer_report}
      REPORT_DB_PASSWORD: ${REPLICATION_REPORT_DB_PASSWORD:-teralizer-report}
    volumes:
      - ..:/teralizer:ro
      - ${TERALIZER_OUTPUT:-../output}:/output
      - ${TERALIZER_STATE:-../state}:/state
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  teralizer-data:
