# Replication package Docker composition for Teralizer.
#
# Services:
#   postgres  - PostgreSQL 17.1 database (port 5432)
#   adminer   - Database web UI (port 18080)
#   teralizer - Java pipeline for data collection (on-demand)
#   verify    - Output comparison tool (on-demand)
#
# Usage:
#   # Quick start (inspect data, re-run analysis)
#   docker compose up -d postgres adminer
#   ./scripts/import-databases.sh
#   ./scripts/run-analysis.sh verify
#   # Open http://localhost:18080 for Adminer
#
#   # Verify outputs match after re-running analysis
#   docker compose run --rm verify original verify
#
#   # Run pipeline on subset (via run.sh script)
#   ./scripts/run.sh --corpus real-world --count 5
#
#   # Tear down
#   docker compose down -v

services:
  postgres:
    image: postgres:17.1
    container_name: postgres-replication
    shm_size: 512m
    environment:
      POSTGRES_USER: ${DB_USER:-teralizer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-teralizer}
    # Tuning for bulk imports and analysis queries
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - work_mem=64MB
      - -c
      - max_wal_size=4GB
      - -c
      - min_wal_size=1GB
      - -c
      - wal_buffers=64MB
      - -c
      - checkpoint_timeout=30min
      - -c
      - checkpoint_completion_target=0.9
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-teralizer}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G

  adminer:
    image: adminer:4.8.1
    container_name: adminer-replication
    ports:
      - "127.0.0.1:${ADMINER_PORT:-18080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  teralizer:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: teralizer-replication
    platform: linux/amd64
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-teralizer}
      DB_PASSWORD: ${DB_PASSWORD:-teralizer}
      DATA_DIR: /app/data
    volumes:
      - ../projects:/app/projects
      - teralizer-data:/app/data
      - ../project-configs:/app/project-configs:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 8G

  # One-shot verification service
  # Usage: docker compose run --rm verify [original verify|original replicate]
  verify:
    build:
      context: ..
      dockerfile: replication/Dockerfile.analysis
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-teralizer}
      DB_PASSWORD: ${DB_PASSWORD:-teralizer}
    volumes:
      - ../analysis:/app/analysis
    working_dir: /app/analysis
    entrypoint: ["/opt/venv/bin/python", "-m", "teralizer.verify"]
    command: ["original", "verify"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  teralizer-data:
