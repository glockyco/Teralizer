# Replication package Docker composition for Teralizer.
#
# Services:
#   postgres  - PostgreSQL 17.1 database (port 5432)
#   adminer   - Database web UI (port 18080)
#   analysis  - Jupyter Lab for analysis notebooks (port 8888)
#   teralizer - Java pipeline for data collection (on-demand)
#
# Usage:
#   # Quick start (inspect data, re-run analysis)
#   docker compose up -d postgres adminer
#   ./scripts/import-databases.sh
#   docker compose up -d analysis
#   # Open http://localhost:8888 for Jupyter, http://localhost:18080 for Adminer
#
#   # Run pipeline on subset (via run.sh script)
#   ./scripts/run.sh --dataset extended --count 5
#
#   # Tear down
#   docker compose down -v

services:
  postgres:
    image: postgres:17.1
    container_name: postgres-replication
    shm_size: 512m
    environment:
      POSTGRES_USER: ${DB_USER:-teralizer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-teralizer}
    # Tuning for bulk imports and analysis queries
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - work_mem=64MB
      - -c
      - max_wal_size=4GB
      - -c
      - min_wal_size=1GB
      - -c
      - wal_buffers=64MB
      - -c
      - checkpoint_timeout=30min
      - -c
      - checkpoint_completion_target=0.9
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-teralizer}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G

  adminer:
    image: adminer:4.8.1
    container_name: adminer-replication
    ports:
      - "127.0.0.1:${ADMINER_PORT:-18080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  analysis:
    build:
      context: ..
      dockerfile: replication/Dockerfile.analysis
    container_name: analysis-replication
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-teralizer}
      DB_PASSWORD: ${DB_PASSWORD:-teralizer}
      DB_NAME_DEV: ${DB_NAME_DEV:-postgres_dev}
      DB_NAME_TEST: ${DB_NAME_TEST:-postgres_test}
      # Variant controls database selection and output paths:
      # - verify: use original DBs, output to verify/ (default for evaluators)
      # - replicate: use replication DBs, output to replicate/
      DATASET_VARIANT: ${DATASET_VARIANT:-verify}
    volumes:
      - ../analysis:/app/analysis:ro
      - analysis-output:/app/analysis/output
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G

  teralizer:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: teralizer-replication
    platform: linux/amd64
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-teralizer}
      DB_PASSWORD: ${DB_PASSWORD:-teralizer}
      DB_NAME_DEV: ${DB_NAME_DEV:-postgres_dev}
      DB_NAME_TEST: ${DB_NAME_TEST:-postgres_test}
      DATA_DIR: /app/data
    volumes:
      - ../projects:/app/projects
      - teralizer-data:/app/data
      - ../project-configs:/app/project-configs:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 8G

volumes:
  postgres-data:
  analysis-output:
  teralizer-data:
