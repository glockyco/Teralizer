raw_status = "jqwik status before the filter-exhaustion hook remaps it: SUCCESSFUL, ABORTED, or FAILED. UNKNOWN means the outcome file is missing."
final_status = "Status after the hook maps a filter-exhaustion failure to success if a distinct non-seed tuple was recorded: SUCCESSFUL, ABORTED, or FAILED. UNKNOWN means the outcome file is missing."
throwable_type = "Class name of the throwable from the raw result, or an empty string if there was no throwable. Null if no outcome file was found."
