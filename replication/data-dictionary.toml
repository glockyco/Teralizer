# Descriptions of the corpus tables, the derived views that the reports read, and the
# result CSV files of the reports.
# `python -m teralizer.release data-dictionary` renders them into DATA-DICTIONARY.md
# and checks that they name exactly the columns of the corpora and the CSV headers.

format = "teralizer-data-dictionary"
format_version = 1

[[relation]]
name = "project"
description = "One project workspace processed by the pipeline, with its run configuration and paths. A resumed run reuses the project row."

[relation.columns]
id = "Primary key."
type = "Build system identified from the build file: MAVEN, GRADLE, JAIGANTIC, ANT, or UNKNOWN. Only Maven and Gradle are supported by setup."
test_framework = "JUnit family detected from dependency JAR names: JUNIT_3, JUNIT_4, JUNIT_5, or UNKNOWN. Null if framework detection did not run or its result was not saved."
test_framework_version = "Version extracted from the detected JUnit JAR name. Null if detection did not record a JUnit version."
root_path = "Path to the project workspace."
data_path = "Base directory for pipeline artifacts for this project."
main_source_path = "Directory of production Java sources, configured explicitly or set by build-system setup. Null if neither supplied nor saved during setup."
test_source_path = "Directory of test Java sources, configured explicitly or set by build-system setup. Null if neither supplied nor saved during setup."
main_compiled_path = "Directory for compiled production classes, configured explicitly or set by build-system setup. Null if neither supplied nor saved during setup."
test_compiled_path = "Directory for compiled test classes, configured explicitly or set by build-system setup. Null if neither supplied nor saved during setup."
test_reports_path = "Directory for JUnit test execution reports, configured explicitly or set by build-system setup. Null if neither supplied nor saved during setup."
coverage_reports_path = "Directory for JaCoCo coverage reports, configured explicitly or set by build-system setup. Null if neither supplied nor saved during setup."
mutation_reports_path = "Directory for PIT mutation reports, configured explicitly or set by build-system setup. Null if neither supplied nor saved during setup."
classpath = "Resolved classpath for the project, including production and test class directories and dependency JARs. Null if classpath setup did not save a result."
git_version = "Git HEAD commit hash of the project workspace at setup. Null if setup did not save a hash or could not find HEAD in a local .git directory."
tool_git_version = "Git HEAD commit hash of the Teralizer working directory at setup. Null if setup did not save a hash or could not find HEAD in a local .git directory."
use_test_generation = "Whether the configuration requests EvoSuite test generation."
use_test_generalization = "Whether the configuration requests test generalization."
configuration = "Effective Teralizer configuration rendered as formatted text."
runtime = "Wall-clock time in seconds for the last run that saved its elapsed time, including all pipeline phases executed in that invocation. Null until a run reaches the runtime write."
use_test_reduction = "Whether the configuration requests the reduction phase after generalization."

[[relation]]
name = "test"
description = "One test method identified from an execution report or recorded directly when EvoSuite postprocessing excludes it."

[relation.columns]
id = "Primary key."
project_id = "Project containing the test, project.id."
test_file_path = "Path to the Java source file for the reported test class or the postprocessed EvoSuite class."
test_class_qualified_name = "Fully qualified name of the executing class from the test report, or of the generated class for a test excluded during EvoSuite postprocessing."
test_method_qualified_name = "Normalized executing class name plus the method name without invocation arguments, or the qualified generated class name plus the method name for a test excluded during EvoSuite postprocessing."
test_package_name = "Package of the reported or generated test class."
test_class_name = "Simple name of the reported or generated test class."
test_method_name = "Simple method name, with invocation arguments removed from report names."
test_method_absolute_path = "Spoon AST path from the model root to the test method declaration. Null if source mapping did not record a method."
test_method_relative_path = "Spoon AST path to the test method relative to its declaring class, which can differ from the executing class. Null if source mapping did not record a method."
test_annotation_name = "Test marker: Test, RepeatedTest, ParameterizedTest, TestFactory, TestTemplate, Property, Example, TestCase for JUnit 3, or TestNG. Null if no recognized marker was recorded."
test_annotations_source_code = "Newline-separated Java renderings of the method annotations, or an empty string if there are none. Null if source mapping did not reach the annotation write."
line_count = "Number of lines in Spoon's Java rendering of the test method. Null if source mapping did not reach the line count."
is_included = "Whether the pipeline still considers the test eligible for downstream processing."
exclusion_info = "Text describing why the pipeline excluded the test. Null if no exclusion reason was recorded."

[[relation]]
name = "assertion"
description = "One assertion call detected by source analysis in a test method, with its selected method under test and extraction artifacts when available."

[relation.columns]
id = "Primary key."
project_id = "Project containing the assertion, project.id."
test_id = "Test containing the assertion, test.id."
assertion_name = "Simple name of the assertion method called."
assertion_arguments = "JSON array of assertion arguments in call order, with each expression's type and rendered Java text."
assertion_source_code = "Java rendering of the assertion call from the Spoon source model."
assertion_absolute_path = "Spoon AST path from the model root to the assertion call."
assertion_relative_path = "Spoon AST path to the assertion call relative to the test method declaration."
tested_file_path = "Source file of the declaring type of the selected method, relative to the tool working directory. Null if analysis could not record a source declaration and both call and declaration paths."
tested_class_qualified_name = "Fully qualified name of the selected method's declaring type. Null if analysis could not record a source declaration and both call and declaration paths."
tested_method_qualified_name = "Qualified declaring type and simple name of the selected method, without a parameter signature. Null if analysis could not record a source declaration and both call and declaration paths."
tested_package_name = "Package of the selected method's declaring type. Null if analysis could not record a source declaration and both call and declaration paths."
tested_class_name = "Simple name of the selected method's declaring type. Null if analysis could not record a source declaration and both call and declaration paths."
tested_method_name = "Simple name of the selected method, taken from the invocation when the declaration is unavailable. Null if no method call was selected."
tested_method_parameters = "JSON array of generalizable input names and types, or of formal parameter names and types if no inputs were derived. Null if analysis could not record a source declaration and both call and declaration paths."
tested_method_return_type = "Declared return type of the selected method. Null if analysis could not record a source declaration and both call and declaration paths."
tested_method_absolute_path = "Spoon AST path from the model root to the selected method declaration. Null if analysis could not record a source declaration and both call and declaration paths."
tested_method_relative_path = "Spoon AST path to the selected method declaration relative to its declaring type. Null if analysis could not record a source declaration and both call and declaration paths."
tested_method_call_arguments = "JSON array of types and Java expressions for the derived generalizable inputs, or for the invocation arguments when no inputs were derived. Null if no method call was selected."
tested_method_call_source_code = "Java rendering of the selected method invocation. Null if no method call was selected."
tested_method_call_absolute_path = "Spoon AST path from the model root to the selected method invocation. Null if no call was selected or either invocation path could not be obtained."
tested_method_call_relative_path = "Spoon AST path to the selected method invocation relative to the test method. Null if no call was selected or either invocation path could not be obtained."
instrumented_file_path = "Java source path for the instrumented class. Null if JPF instrumentation did not record it."
instrumented_class_qualified_name = "Fully qualified name of the generated instrumented class. Null if JPF instrumentation did not record it."
instrumented_method_qualified_name = "Fully qualified instrumented class name plus the generated method name. Null if JPF instrumentation did not record it."
instrumented_package_name = "Package of the instrumented class, copied from the test. Null if JPF instrumentation did not record it."
instrumented_class_name = "Simple name of the generated instrumented class. Null if JPF instrumentation did not record it."
instrumented_method_name = "Name of the instrumented method, formed from the selected method name and assertion ID. Null if JPF instrumentation did not record it."
driver_file_path = "Java source path for the generated JPF driver. Null if JPF instrumentation did not record it."
driver_class_qualified_name = "Fully qualified name of the generated JPF driver class. Null if JPF instrumentation did not record it."
driver_package_name = "Package of the generated JPF driver, copied from the test. Null if JPF instrumentation did not record it."
driver_class_name = "Simple name of the generated JPF driver class. Null if JPF instrumentation did not record it."
jpf_config_path = "Path to the assertion's JPF configuration file. Null if JPF instrumentation did not record it."
input_values_path = "Path assigned during instrumentation for the JSON file of concrete inputs captured by JPF. Null if JPF instrumentation did not record it."
output_value_path = "Path assigned during instrumentation for the JSON file of the concrete result captured by JPF. Null if JPF instrumentation did not record it."
input_specification_path = "Path assigned during instrumentation for the JSON file of the symbolic input constraint. Null if JPF instrumentation did not record it."
output_specification_path = "Path assigned during instrumentation for the JSON file of the symbolic output model. Null if JPF instrumentation did not record it."
equivalent_assertions = "JSON array of sorted assertion.id values, including this assertion, for included assertions in the project with the same tested method qualified name and input specification file hash. Null if JPF analysis did not assign this assertion to a group."
input_model_statistics = "JSON object with rendered input model length in UTF-16 code units and counts of operations, operation shapes, operators, and operand types. Null if JPF analysis did not record statistics for the assertion."
output_model_statistics = "JSON object with rendered output model length in UTF-16 code units and counts of operations, operation shapes, operators, and operand types. Null if JPF analysis did not record statistics for the assertion."
is_included = "Whether the pipeline still considers the assertion eligible for downstream processing."
exclusion_info = "Text describing why the pipeline excluded the assertion. Null if no exclusion reason was recorded."
generalization_recipe = "JSON recipe with Spoon paths and types for the selected oracle expression and method, and the input sites to vary. Null if analysis did not record a recipe backed by a resolvable source declaration and paths."
output_spec_class = "Shape of the captured output model: SYMBOLIC with model variables, CONSTANT without them, NULL_CONCRETE with no model, or EXCEPTION for a thrown result. Null if JPF extraction did not save the classification."
output_is_literal = "Whether JPF detected a value return immediately following a bytecode constant push, ignoring GOTO instructions. Null if JPF extraction did not save the flag."
concretization_events = "Count of native calls receiving at least one symbolic argument during JPF extraction. Null if extraction did not save the count."
post_concretization_divergence_risk = "Whether JPF saw a native call with a symbolic argument and either a later application branch without symbolic operands or a throw from outside application code. Null if extraction did not save the flag."
concretized_methods = "JSON object mapping fully qualified native method names to counts of calls that received symbolic arguments. Null if JPF extraction did not save a nonempty map."

[[relation]]
name = "generalization"
description = "One attempt to generate a test from an assertion for a configured variant, whether or not source was produced."

[relation.columns]
id = "Primary key."
project_id = "Project of the generalization attempt, project.id."
test_id = "Test from which the generalization was derived, test.id."
assertion_id = "Assertion from which the generalization was derived, assertion.id."
variant = "Configuration key for the generalization algorithm and jqwik try limit, such as IMPROVED_200_TRIES."
file_path = "Path where the generated Java file is written, next to the source test file."
class_qualified_name = "Generated class name including its package, if any."
method_qualified_name = "Qualified generated class name followed by the test method name, without a parameter signature."
package_name = "Package of the source test, reused for the generated class."
class_name = "Simple name of the generated class, derived from the source test class, test method, and generalization ID."
method_name = "Simple name of the generated test method, carried over from the source test."
total_constraint_count = "Number of flattened input path condition clauses in the IMPROVED generation plan, after dropping clauses that reference only inputs not generated. Null if the pipeline did not reach the step that records that plan."
used_constraint_count = "Number of distinct plan clauses incorporated into input generators, not the number checked by the input filter. Null if the pipeline did not record an IMPROVED generation plan."
line_count = "Number of lines in the whole generated Java file, including blank lines. Initialized to zero before the file is written and counted."
is_included = "Whether the pipeline has kept the attempt eligible for subsequent processing. It starts true and can be cleared by a gate, filter rejection, or task failure."
exclusion_info = "Reason the pipeline excluded this attempt, such as a gate code, filter stage, or task error. Null if no exclusion was recorded."
widening_refusal_code = "Specific reason a captured oracle did not support widening inputs: EXCEPTION_CONCRETIZATION_DIVERGENCE_RISK, EXCEPTION_PATH_CONDITION_NOT_COVERING_PARAMETERS, NULL_CONCRETE_OUTPUT_NOT_LITERAL, NULL_CONCRETE_CONCRETIZATION_EVENTS, NULL_CONCRETE_PARAMETERS_EMPTY, or NULL_CONCRETE_PATH_CONDITION_NOT_COVERING_PARAMETERS. Null if no widening refusal was recorded."

[[relation]]
name = "generalization_lifecycle"
description = "One status record for a generalization that produced source, updated as the build, test, and validation stages report outcomes."

[relation.columns]
id = "Primary key."
generalization_id = "Generalization tracked by this record, generalization.id."
generated_source_created = "Whether generated test source was written and archived. This is true when the row is created."
generated_project_compiled = "Whether the build succeeded for the project and variant containing this generalization."
generated_tests_executed = "Whether the generated-test execution stage succeeded for the project and variant. This does not mean that this test passed."
generated_report_collected = "Whether the generated-test report collection stage succeeded for this generalization."
generated_filter_passed = "Whether no generated-test filter rejected this generalization after its report was collected."
generated_pit_collected = "Whether the generated PIT collection stage completed for the project and variant. Also true when the stage was skipped because PIT was disabled."
final_usable = "Whether all six lifecycle flags are true."
final_failure_stage = "First stage whose lifecycle flag is false: BUILD_PROJECT_GENERALIZED, EXECUTE_TESTS_GENERALIZED, COLLECT_JUNIT_REPORTS_GENERALIZED, FILTER_GENERALIZATIONS, or COLLECT_PIT_DATA_GENERALIZED. Null when all flags are true."
final_failure_code = "Diagnostic or filter reason code retained for the failing stage. Null when all flags are true or no code was retained for that stage."

[[relation]]
name = "filter_result"
description = "One decision from a filter checking a test, assertion, or generalization, or from compile validation excluding generated code."

[relation.columns]
id = "Primary key."
project_id = "Project in which the decision was made, project.id."
test_id = "Test evaluated by a test-level check, test.id. Null for assertion or generalization checks."
assertion_id = "Assertion evaluated by an assertion-level check, assertion.id. Null for test or generalization checks."
generalization_id = "Generalization evaluated by a generalization-level check, generalization.id. Null for test or assertion checks."
filter_name = "Fully qualified Java class name of the filter, or GeneratedTestValidator for compile validation."
decision = "ACCEPT passes the check, REJECT excludes the item, and DEFER does not by itself exclude the item."
reason = "Human-readable explanation or compiler error text. Empty if the check supplied no explanation."
reason_code = "Machine-readable reason for the decision. Null when the check did not assign a code."
depends_on = "Related exclusion or precondition code: EXCLUDED_TEST, EXCLUDED_ASSERTION, MISSING_MUT, or UNSUPPORTED_ASSERTION. Null when the check did not record one."
detail_json = "Additional decision details as a JSON object, such as all_reason_codes for missing method metadata or return_type for an unsupported return type. Null when the check did not supply details."

[[relation]]
name = "evosuite_runtime"
description = "One timed phase from the EvoSuite console output for a target class."

[relation.columns]
id = "Primary key."
project_id = "Project for which EvoSuite generated tests, project.id."
class_name = "Fully qualified name of the class passed to EvoSuite as the generation target."
step = "Sequential position of the timing record for this target class, starting at 1."
phase_name = "Phase name taken from the EvoSuite status update that started the timed interval."
runtime = "Elapsed seconds from the phase's status update to the next phase update or the finish marker."

[[relation]]
name = "evosuite_report"
description = "One row of EvoSuite's generation statistics for a target class."

[relation.columns]
id = "Primary key."
project_id = "Project for which EvoSuite generated tests, project.id."
class_name = "Fully qualified name of the target class in EvoSuite's statistics."
criterion = "Coverage criteria as reported by EvoSuite, stored as a single string that can contain multiple criteria."
coverage = "Overall coverage reported by EvoSuite as a fraction from 0 to 1."
total_goals = "Count of coverage goals reported by EvoSuite."
covered_goals = "Count of coverage goals met by the generated suite."

[[relation]]
name = "junit_test_report"
description = "One reported JUnit test case from an original, initial, or generalized suite. Reports for a generated property also include other cases from its generated class."

[relation.columns]
id = "Primary key."
project_id = "Project whose test suite ran, project.id."
test_id = "Test selected for report collection, test.id. Null when the report is not linked to a test, including when collected for a generalization."
generalization_id = "Generalization selected for report collection, generalization.id. Null when the report was not collected for a generalization."
step = "Numeric pipeline step for JUnit report collection."
stage = "JUnit report collection stage: COLLECT_JUNIT_REPORTS_ORIGINAL, COLLECT_JUNIT_REPORTS_INITIAL, or COLLECT_JUNIT_REPORTS_GENERALIZED."
variant = "Configured generalization variant for the suite. Null for the original and initial suites."
test_package_name = "Package of the test or generalization selected for report collection."
test_class_name = "Unqualified class name of the test or generalization selected for report collection."
test_method_name = "Method name of the test or generalization selected for report collection. This can differ from the case that produced the row."
test_case_name = "Test case name as reported in the XML file."
result = "Outcome derived from the XML report: PASSED, FAILED, SKIPPED, or ERROR."
runtime = "Test case duration in seconds from the XML report, or 0 if the time attribute is absent."
failure_message = "Message parsed from the nonpassing outcome in the XML report. Null when the parser supplies no message."
failure_type = "Failure or error type reported by the XML parser, which can also supply a skip marker. Null when the parser supplies no type."
failure_error_line = "Source line number extracted as text from a matching test-class stack frame, or an empty string if none is found. Null when no failure or error trace was processed."
failure_detail = "Text contents of the XML failure or error element, typically the stack trace. Null when there is no such element."
report_file_path = "Path to the preserved copy of the source XML report."

[[relation]]
name = "jacoco_coverage_report"
description = "One class's JaCoCo CSV coverage counters for an original, initial, or generalized test suite."

[relation.columns]
id = "Primary key."
project_id = "Project whose suite produced the coverage report, project.id."
step = "Numeric pipeline step for JaCoCo coverage collection."
stage = "JaCoCo collection stage: COLLECT_JACOCO_DATA_ORIGINAL, COLLECT_JACOCO_DATA_INITIAL, or COLLECT_JACOCO_DATA_GENERALIZED."
variant = "Configured generalization variant for the suite. Null for the original and initial suites."
covered_package = "Package name of the measured class from the JaCoCo report."
covered_class = "Class name from the JaCoCo report, stored separately from the package."
instruction_missed = "Count of missed bytecode instructions."
instruction_covered = "Count of covered bytecode instructions."
branch_missed = "Count of missed branches."
branch_covered = "Count of covered branches."
line_missed = "Count of source lines marked missed by JaCoCo."
line_covered = "Count of source lines marked covered by JaCoCo, including partially covered lines."
complexity_missed = "Missed cyclomatic complexity in JaCoCo complexity units."
complexity_covered = "Covered cyclomatic complexity in JaCoCo complexity units."
method_missed = "Count of methods marked missed by JaCoCo."
method_covered = "Count of methods marked covered by JaCoCo."

[[relation]]
name = "pit_coverage_report"
description = "One pairing of a covered code block and a covering test entry in PIT's coverage XML for a suite."

[relation.columns]
id = "Primary key."
project_id = "Project whose suite produced the PIT report, project.id."
test_id = "Covering test, test.id. Null when PIT's test name does not resolve to a registered test."
generalization_id = "Covering generalization, generalization.id. Null when PIT's test name does not resolve to a registered generalization."
step = "Numeric pipeline step for PIT data collection."
stage = "PIT collection stage: COLLECT_PIT_DATA_ORIGINAL, COLLECT_PIT_DATA_INITIAL, or COLLECT_PIT_DATA_GENERALIZED."
variant = "Configured generalization variant for the suite. Null for the original and initial suites."
covered_package_name = "Package of the class containing the covered block."
covered_class_name = "Unqualified name of the class containing the covered block."
covered_method_name = "Name of the method containing the covered block."
covered_method_description = "JVM method descriptor, including parameter and return types, split from PIT's method signature."
covered_block_number = "Numeric identifier of the covered bytecode block within the method, as assigned by PIT."
test_package_name = "Package parsed from the covering test's PIT name, or an empty string for an unqualified test class."
test_class_name = "Unqualified class name parsed from the covering test's PIT name."
test_method_name = "Method name parsed from the covering test's PIT name. Null when no method is identified."

[[relation]]
name = "pit_mutation_report"
description = "One mutant and its outcome in PIT's mutation report for an original, initial, or generalized test suite."

[relation.columns]
id = "Primary key."
project_id = "Project whose code was mutated, project.id."
killing_test_id = "Test identified by PIT as killing the mutant, test.id. Null when the report does not identify a killer that resolves to a registered test."
killing_generalization_id = "Generalization identified by PIT as killing the mutant, generalization.id. Null when the report does not identify a killer that resolves to a registered generalization."
step = "Numeric pipeline step for PIT data collection."
stage = "PIT collection stage: COLLECT_PIT_DATA_ORIGINAL, COLLECT_PIT_DATA_INITIAL, or COLLECT_PIT_DATA_GENERALIZED."
variant = "Configured generalization variant for the suite. Null for the original and initial suites."
is_detected = "Whether PIT marked the mutant as detected. Detection does not require a recorded killing test."
status = "PIT outcome: KILLED, SURVIVED, TIMED_OUT, NON_VIABLE, MEMORY_ERROR, RUN_ERROR, or NO_COVERAGE."
number_of_tests_run = "Count of tests that PIT reports running against the mutant."
source_file = "Source file name reported by PIT for the mutated class."
mutated_class = "Unqualified name of the mutated class."
mutated_method = "Name of the method containing the mutation."
method_description = "JVM descriptor of the mutated method as reported by PIT."
line_number = "Source line number of the mutation as reported by PIT."
mutator = "Name of the PIT mutation operator that produced the mutant."
indexes = "Sorted JSON array of PIT's mutation instruction indexes, stored as text. An empty array means none were reported."
blocks = "Sorted JSON array of PIT's bytecode block numbers for the mutant, stored as text. An empty array means none were reported."
killing_package_name = "Package parsed from the killing test's PIT name, or an empty string for an unqualified class. Null when no killing test name could be parsed."
killing_class_name = "Unqualified class name parsed from the killing test's PIT name. Null when no killing test name could be parsed."
killing_method_name = "Method name parsed from the killing test's PIT name. Null when no killing test method could be identified."
description = "PIT's textual description of the change made by the mutation."
mutated_package = "Package of the mutated class."

[[relation]]
name = "task"
description = "One execution attempt of a pipeline task at project, test, assertion, generalization, or shared scope."

[relation.columns]
id = "Primary key."
project_id = "Project associated with the task, project.id. Null if the task has no known project."
test_id = "Test associated with the task, test.id. Null if the task has no known test."
assertion_id = "Assertion associated with the task, assertion.id. Null if the task has no known assertion."
generalization_id = "Generalization associated with the task, generalization.id. Null if the task has no known generalization."
step = "Integer ordering index assigned to the processing stage, not a count of attempts. Null for task records with no assigned stage index."
stage = "Processing stage name, such as ANALYZE_TESTS or EXECUTE_JPF."
variant = "Configured test generalization variant name. Null for tasks not scoped to a single variant."
status = "Execution state: IN_PROGRESS, SUCCEEDED, or FAILED."
runtime = "Wall-clock seconds spent executing the task, excluding writes to its task row. Null if timing was not recorded, including tasks still in progress."
info = "Newline-separated messages reported by the task, with the exception stack trace prepended on failure. Null if no message or exception was recorded."

[[relation]]
name = "assertion_semantics"
description = "One static classification of an assertion call, its selected argument, and any fail or matcher context."

[relation.columns]
id = "Primary key."
assertion_id = "Assertion classified by this record, assertion.id."
semantic_kind = "Category assigned from the assertion call: EQUALITY, INEQUALITY, BOOLEAN_TRUE, BOOLEAN_FALSE, NULLNESS_NULL, NULLNESS_NOT_NULL, SAMENESS, ARRAY_EQUALITY, HAMCREST_MATCHER, ASSERTJ_MATCHER, FAIL_SENTINEL, or UNKNOWN."
argument_shape = "Syntax category of the selected assertion argument: METHOD_CALL, LITERAL, VARIABLE_OR_FIELD, OTHER, or NONE if no argument was selected."
fail_context = "Enclosing context of a fail() call: CATCH_BLOCK_SHOULD_NOT_REACH, GUARD_BRANCH, TRY_BLOCK_EXPECTING_EXCEPTION, or UNKNOWN. Null for other assertions."
matcher_family = "Matcher library assigned to assertThat: ASSERTJ for an AssertJ declaring type, otherwise HAMCREST. Null for other assertion kinds."
matcher_name = "Simple method name of the matcher call. Null if the assertion has no matcher or the selected matcher argument is not a method call."

[[relation]]
name = "build_environment_observation"
description = "One snapshot of build settings and generated test syntax recorded before a project build attempt."

[relation.columns]
id = "Primary key."
project_id = "Project whose build environment was observed, project.id."
stage = "Build stage: BUILD_PROJECT_ORIGINAL, BUILD_PROJECT_INSTRUMENTED, BUILD_PROJECT_INITIAL, BUILD_PROJECT_GENERALIZED, or RESTORE_ORIGINAL_BUILD."
build_tool = "Build tool category: MAVEN, GRADLE, or UNKNOWN for any other project type."
compiler_source = "First matching Java source compatibility setting in the inspected build file, stored as written. Null when no matching setting was found."
compiler_target = "First matching Java target compatibility setting in the inspected build file, stored as written. Null when no matching setting was found."
compiler_release = "First matching Maven Java release setting in the inspected build file, stored as written. Null for other build tools or when no matching Maven setting was found."
generated_source_required_level = "Minimum language level recorded for generated test syntax, 1.8 when the scan finds a lambda or method reference marker. Null when neither marker was found or the scan did not finish."
generated_uses_lambdas = "Whether a text scan of generated test files found the lambda operator surrounded by spaces. Null if not recorded."
generated_uses_method_references = "Whether a text scan of generated test files found the double-colon operator. Null if not recorded."
generated_uses_diamond = "Whether a text scan of generated test files found empty angle brackets. Null if not recorded."
test_source_floor = "Build-file outcome for the Java 8 test compiler floor: APPLIED, NOT_NEEDED, or SKIPPED_UNRESOLVABLE. Null for other build tools or when the Maven build file could not be read or parsed."
surefire_floor = "Outcome of checking the Maven Surefire version floor for running generated tests: APPLIED, NOT_NEEDED, or SKIPPED_UNRESOLVABLE. Gradle records NOT_NEEDED, and the value is null if either Maven build file could not be read or parsed or the project uses another build tool."

[[relation]]
name = "jpf_extraction_summary"
description = "One snapshot of Java PathFinder (JPF) extraction tasks, specifications, and diagnostics for a project or a test within it."

[relation.columns]
id = "Primary key."
project_id = "Project summarized by this record, project.id."
test_id = "Test summarized by this record, test.id. Null for the project-wide summary."
assertions_scheduled = "Number of EXECUTE_JPF task records in scope, regardless of status."
assertions_instrumented = "Number of ADD_JPF_INSTRUMENTATION task records in scope with status SUCCEEDED."
assertions_jpf_succeeded = "Number of EXECUTE_JPF task records in scope with status SUCCEEDED."
assertions_jpf_failed = "Number of EXECUTE_JPF task records in scope with status FAILED."
assertions_with_input_spec = "Number of assertions in scope whose stored input model statistics report a rendered Java size greater than zero when the summary is written."
assertions_with_output_spec = "Number of assertions in scope with a recorded output specification class other than NULL_CONCRETE."
assertions_with_complete_spec = "Number of assertions in scope that meet both the input and output specification checks."
