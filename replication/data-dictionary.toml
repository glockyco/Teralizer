[[relation]]
name = "mut_resolution_observation"
description = "One static method-under-test resolution outcome for an assertion, including cases with no usable candidate."

[relation.columns]
id = "Primary key."
assertion_id = "Assertion for which the resolver looked for a method under test, assertion.id."
project_id = "Project containing the assertion, project.id."
test_id = "Test containing the assertion, test.id."
status = "RESOLVED means a call was picked with a source method on a nonlocal, nonanonymous declaring type. CHARACTERIZATION_ONLY means a call was picked without such a declaration, and NONE means no call was picked."
confidence_tier = "Resolver confidence after applying corroborating signals: T1_PROVEN, T2_CORROBORATED, T3_SINGLE_WEAK, T4_GUESS, or T5_NONE."
deciding_signal = "Evidence used to make the pick: DIRECT_ACTUAL_CALL, LOCAL_VARIABLE_PRODUCER, FIELD_PRODUCER, SUBEXPRESSION_PRODUCER, INSPECTOR_UNWRAP, UNIQUE_PRODUCER_ELIMINATION, ASSERT_THROWS_LAMBDA, RANKED_GUESS, or NONE."
corroborating_signals = "JSON array stored as text with any additional identity evidence: NAME_MATCH for a matching test method name and FOCAL_CLASS_MEMBER for a matching focal type. Null when neither signal applies."
no_pick_reason = "Why no call usable for generalization was picked: LIBRARY_DECLARATION, UNRESOLVED_SOURCE_DECLARATION, UNPATHABLE_SOURCE_DECLARATION, NO_VISIBLE_CALL, or UNSUPPORTED_ASSERTION_SHAPE. Null when status is RESOLVED."
candidate_count = "Number of candidates retained by the resolver, including the pick and any ranked alternatives. Zero when there is no pick."
resolved_call_source = "Source rendering of the picked call as represented in the Java syntax tree. Null when no call was picked."
resolved_method_name = "Simple method name on the picked call. Null when no call was picked."
resolved_declaring_type = "Qualified declaring type name on the picked call. Null when there is no pick or it has no declaring type reference."
resolved_parameter_types = "JSON array stored as text with qualified parameter type names in declaration order. Null when there is no picked source method declaration."
resolved_return_type = "Qualified return type name from the picked method declaration. Null when there is no picked source method declaration."
inspector_unwrapped = "Whether the resolver traced through an inspector call to a call that produced its receiver."
shallow_inspector_pick = "Whether the resolver picked an inspector call because it could not trace its variable or field receiver to a producer."
focal_type = "Qualified name of the inferred class under test, based on the test class name or the mirrored source path. Null when no focal type was found."
focal_type_source = "Evidence used to infer the focal type: PATH_AND_NAME, NAME_ONLY, PATH_ONLY, or NONE when neither identifies one. Null if not recorded, distinct from NONE."
focal_agreement = "Whether the picked call's declaring type matches the inferred focal type. Null when there is no pick or no inferred focal type."
candidate_param_count = "Number of declared parameters of the picked method. Null when there is no picked source method declaration."
candidate_param_supported = "Whether at least one declared parameter type of the picked method supports input generation. Null when there is no picked source method declaration."
candidate_return_supported = "Whether the picked method's declared return type is supported for output values. Null when there is no picked source method declaration."
oracle_agreement = "Reserved for agreement with original PIT evidence. Always null because the pipeline does not populate it."
candidate_details = "Ranked candidates not picked, stored as a JSON array of objects with methodName, declaringType, and callSource. Null when no alternatives were retained."
actual_shape = "Syntax category of the asserted actual expression: LITERAL, VARIABLE, FIELD_ACCESS, SINGLE_CALL, CHAINED_CALLS_END0ARG, CHAINED_CALLS_ENDNARG, CTOR_ONLY, CTOR_RECEIVER_CALL, OPERATOR_COMPOSITE, ARRAY_INDEX, LAMBDA_OR_METHODREF, or NONE. Null if not recorded, distinct from NONE."
receiver_provenance = "Origin of the root receiver of the asserted call: INLINE_CTOR, LOCAL_CTOR, LOCAL_CTOR_MUTATED, LOCAL_OTHER, FIELD, PARAM_OR_STATIC, or NONE. Null if not recorded, distinct from NONE."

