[[relation]]
name = "jqwik_property_execution"
description = "One generalization's imported jqwik outcome for a registered execution, or an explicit record that its outcome file is missing."

[relation.columns]
id = "Primary key."
jqwik_execution_run_id = "Registered jqwik diagnostic run, jqwik_execution_run.id."
project_id = "Project containing the property, project.id."
generalization_id = "Generalization whose property outcome was imported, generalization.id."
junit_test_report_id = "Latest junit_test_report.id for the generalization and collection stage by row ID. Null when there is no matching JUnit report row."
