# RQ4

[[claim]]
id = "rq4-processing-time"
rq = "RQ4"
statement = "Test generalization requires 3.4 to 30.9 hours per project, primarily due to Stage 5 mutation testing for test suite reduction (59.2 to 95.7% of total time)."
evidence = "deterministic transformation"
reports = ["rq4"]
collection = "Stage runtimes are wall-clock measurements on the evaluation host. A rerun on other hardware changes the hours. Stage 5 stays the largest share for every project and strategy."

[[claim.check]]
kind = "extent"
report = "rq4"
table = "tab-teralizer-runtimes"
column = "hours"
min = "3.4"
max = "30.9"

[[claim.check]]
kind = "extent"
report = "rq4"
table = "tab-teralizer-stage-runtimes"
column = "stage_5_share"
scale = 100
min = "59.2"
max = "95.7"

[[claim]]
id = "rq4-reduction-volume"
rq = "RQ4"
statement = "Reduction filters 21,478 candidate generalizations down to 1,555 retained tests."
evidence = "deterministic transformation"
reports = ["rq3", "rq5"]

[[claim.check]]
kind = "sum"
report = "rq5"
table = "tab-exclusions-breakdown"
where = { level = "Generalization", strategy = ["NAIVE_200_TRIES", "IMPROVED_200_TRIES"] }
column = "included"
value = "21478"

[[claim.check]]
kind = "sum"
report = "rq3"
table = "tab-tests-per-project"
column = "added_tests"
value = "1555"

[[claim]]
id = "rq4-pareto"
rq = "RQ4"
statement = "Combining short EvoSuite generation with Teralizer generalization achieves better detection-to-runtime ratios than longer EvoSuite generation alone for multiple configurations, and generalization extends the Pareto frontier to detection rates that EvoSuite-only configurations do not reach."
evidence = "analytic derivation"
reports = ["rq4"]

[[claim.check]]
kind = "count"
report = "rq4"
table = "tab-pareto-eqbench"
condition = { column = "teralizer_variant", op = "present" }
value = 12

[[claim.check]]
kind = "count"
report = "rq4"
table = "tab-pareto-eqbench"
where = { evosuite_budget = "60s" }
condition = { column = "teralizer_variant", op = "missing" }
value = 0

[[claim.check]]
kind = "count"
report = "rq4"
table = "tab-pareto-commons"
condition = { column = "teralizer_variant", op = "present" }
value = 8

[[claim.check]]
kind = "top"
report = "rq4"
table = "tab-pareto-eqbench"
by = "detection_rate"
present = "teralizer_variant"

[[claim.check]]
kind = "top"
report = "rq4"
table = "tab-pareto-commons"
by = "detection_rate"
present = "teralizer_variant"

# RQ5

[[claim]]
id = "rq5-generalized-assertions"
rq = "RQ5"
statement = "Of 28,923 identified assertions, 9,881 to 13,814 (34.2 to 47.8%) are successfully generalized across the three strategies."
evidence = "deterministic transformation"
reports = ["rq5"]

[[claim.check]]
kind = "cell"
report = "rq5"
table = "tab-exclusions-breakdown"
where = { strategy = "All", level = "Assertion" }
column = "total"
value = "28923"

[[claim.check]]
kind = "extent"
report = "rq5"
table = "tab-exclusions-breakdown"
where = { level = "Generalization" }
column = "included"
min = "9881"
max = "13814"

[[claim.check]]
kind = "extent"
report = "rq5"
table = "tab-exclusions-breakdown"
where = { level = "Generalization" }
column = "included"
divide_by = { report = "rq5", table = "tab-exclusions-breakdown", where = { strategy = "All", level = "Assertion" }, column = "total" }
scale = 100
min = "34.2"
max = "47.8"

[[claim]]
id = "rq5-assertion-exclusions"
rq = "RQ5"
statement = "Most exclusions occur at the assertion level, primarily due to static analysis limitations in identifying tested methods (24.7%) and parameter types that symbolic analysis cannot model (15.4%). SPF errors and exceeded analysis limits exclude 5.3% and 4.7% of assertions. Test-level filtering excludes 5.5% of assertions due to non-passing Original tests."
evidence = "deterministic transformation"
reports = ["rq5"]

[[claim.check]]
kind = "cell"
report = "rq5"
table = "tab-exclusions-filtering"
where = { row_key = "Assertion:MissingValue" }
column = "reject_pct"
scale = 100
value = "24.7"

[[claim.check]]
kind = "cell"
report = "rq5"
table = "tab-exclusions-filtering"
where = { row_key = "Assertion:ParameterType" }
column = "reject_pct"
scale = 100
value = "15.4"

[[claim.check]]
kind = "sum"
report = "rq5"
table = "tab-exclusions-spf-causes"
where = { group = "SPF exception" }
column = "of_assertions"
scale = 100
value = "5.3"

[[claim.check]]
kind = "sum"
report = "rq5"
table = "tab-exclusions-spf-causes"
where = { group = "Exceeded analysis limit" }
column = "of_assertions"
scale = 100
value = "4.7"

[[claim.check]]
kind = "cell"
report = "rq5"
table = "tab-exclusions-filtering"
where = { row_key = "Assertion:ExcludedTest" }
column = "reject_pct"
scale = 100
value = "5.5"

[[claim]]
id = "rq5-generalized-test-outcomes"
rq = "RQ5"
statement = "Naive generalized tests pass in 71.4 to 77.6% of cases, with failures primarily due to TooManyFilterMissesExceptions (16.1 to 21.7%) and inaccurate specifications (6.0 to 6.6%). Improved increases pass rates to 83.8 to 85.2% by reducing filter misses by 46.8 to 58.4%."
evidence = "deterministic transformation"
reports = ["rq5"]
collection = "Filter misses depend on jqwik's random inputs, so re-collected counts vary. Improved stays below Naive in filter misses for every number of tries."

[[claim.check]]
kind = "extent"
report = "rq5"
table = "tab-exclusions-breakdown"
where = { level = "Generalization", strategy = "NAIVE_*" }
column = "included_pct"
scale = 100
min = "71.4"
max = "77.6"

[[claim.check]]
kind = "extent"
report = "rq5"
table = "tab-exclusions-test-failures"
where = { row_key = "NAIVE_*" }
column = "too_many_filter_misses_pct"
scale = 100
min = "16.1"
max = "21.7"

[[claim.check]]
kind = "extent"
report = "rq5"
table = "tab-exclusions-test-failures"
where = { row_key = "NAIVE_*" }
column = ["assertion_failed_pct", "arithmetic_pct"]
scale = 100
min = "6.0"
max = "6.6"

[[claim.check]]
kind = "extent"
report = "rq5"
table = "tab-exclusions-breakdown"
where = { level = "Generalization", strategy = "IMPROVED_*" }
column = "included_pct"
scale = 100
min = "83.8"
max = "85.2"

[[claim.check]]
kind = "reduction"
report = "rq5"
table = "tab-exclusions-test-failures"
column = "too_many_filter_misses"
pairs = [
    ["NAIVE_10_TRIES", "IMPROVED_10_TRIES"],
    ["NAIVE_50_TRIES", "IMPROVED_50_TRIES"],
    ["NAIVE_200_TRIES", "IMPROVED_200_TRIES"],
]
min = "46.8"
max = "58.4"

