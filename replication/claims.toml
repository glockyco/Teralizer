# Claims-to-evidence matrix for the RQ0 to RQ6 answers of the paper.
#
# Each claim names the reports whose registered outputs carry its evidence and the
# checks that bind every number of the claim to those outputs. Check kinds and the
# evidence classes are defined in analysis/src/teralizer/release/claims.py, which
# also reads the corpora and file inputs of each report from the report registry.
# `python -m teralizer.release claims --analysis analysis` checks every claim
# against a report run.

format = "teralizer-claims"
format_version = 1

# RQ0

[[claim]]
id = "rq0-teralizer-breadth"
rq = "RQ0"
statement = "Across the 12 projects of the JARVIS benchmark, Teralizer creates generalized tests for 337 MUTs in 9 projects."
evidence = "deterministic transformation"
reports = ["rq0"]
collection = "Census collection reruns Teralizer on the twelve census fixtures. Completion depends on the host, and the count of generalized MUTs varies with jqwik's random inputs, so a rerun establishes the pipeline path, not the exact counts."

[[claim.check]]
kind = "macro"
report = "rq0"
macro = "TzRqzeroBreadthTeralizerTotalSoundMuts"
value = "337"

[[claim.check]]
kind = "count"
report = "rq0"
table = "rq0-breadth-summary"
where = { project = "commons-*" }
condition = { column = "sound_muts", op = ">", value = "0" }
value = 9

[[claim]]
id = "rq0-jarvis-breadth"
rq = "RQ0"
statement = "JARVIS reports successful generalization for 9 MUTs in 2 projects."
evidence = "external published reference"
reports = ["rq0"]

[[claim.check]]
kind = "macro"
report = "rq0"
macro = "TzRqzeroBreadthJarvisTotalMuts"
value = "9"

[[claim.check]]
kind = "macro"
report = "rq0"
macro = "TzRqzeroBreadthPublishedProjects"
value = "2"

[[claim]]
id = "rq0-scenario-pvc"
rq = "RQ0"
statement = "Among the 10 scenarios that JARVIS successfully generalizes, Teralizer creates PBTs with higher PVC in 4, lower PVC in 3, and fails to create PBTs in 3 scenarios."
evidence = "deterministic transformation"
reports = ["rq0"]
collection = "Scorecard collection and the CUT-PVC capture rerun the two scorecard fixtures. PVC counts depend on jqwik's random inputs, so a rerun can change individual comparisons."

[[claim.check]]
kind = "count"
report = "rq0"
table = "rq0-table2-comparison"
value = 10

[[claim.check]]
kind = "count"
report = "rq0"
table = "rq0-table2-comparison"
condition = { column = "suite_pvc", op = ">", other = "jarvis_pbt_pvc" }
value = 4

[[claim.check]]
kind = "count"
report = "rq0"
table = "rq0-table2-comparison"
condition = { column = "suite_pvc", op = "<", other = "jarvis_pbt_pvc" }
value = 3

[[claim.check]]
kind = "count"
report = "rq0"
table = "rq0-table2-comparison"
condition = { column = "suite_pvc", op = "missing" }
value = 3

# RQ1

[[claim]]
id = "rq1-eqbench-gain"
rq = "RQ1"
statement = "EqBench-ES projects show the largest mutation-score improvements, 1.22 to 3.93 percentage points or 2.4 to 8.2% relative increase."
evidence = "deterministic transformation"
reports = ["rq1"]
collection = "Controlled collection regenerates the generalized tests with jqwik's random inputs and reruns PIT, so scores vary. The improvement over the initial suite stays positive for every project and strategy."

[[claim.check]]
kind = "extent"
report = "rq1"
table = "tab-mutation-score-improvements"
where = { row_key = ["eqbench-*:NAIVE_*", "eqbench-*:IMPROVED_*"] }
column = "absolute_improvement"
min = "1.22"
max = "3.93"

[[claim.check]]
kind = "extent"
report = "rq1"
table = "tab-mutation-score-improvements"
where = { row_key = ["eqbench-*:NAIVE_*", "eqbench-*:IMPROVED_*"] }
column = "relative_improvement"
min = "2.4"
max = "8.2"

[[claim]]
id = "rq1-commons-es-gain"
rq = "RQ1"
statement = "Commons-ES improves by 0.82 to 1.33 percentage points, a 1.4 to 2.3% relative increase."
evidence = "deterministic transformation"
reports = ["rq1"]

[[claim.check]]
kind = "extent"
report = "rq1"
table = "tab-mutation-score-improvements"
where = { row_key = ["commons-utils-es-*:NAIVE_*", "commons-utils-es-*:IMPROVED_*"] }
column = "absolute_improvement"
min = "0.82"
max = "1.33"

[[claim.check]]
kind = "extent"
report = "rq1"
table = "tab-mutation-score-improvements"
where = { row_key = ["commons-utils-es-*:NAIVE_*", "commons-utils-es-*:IMPROVED_*"] }
column = "relative_improvement"
min = "1.4"
max = "2.3"

[[claim]]
id = "rq1-commons-developer"
rq = "RQ1"
statement = "Commons-Dev shows minimal improvement, 0.05 to 0.07 percentage points, due to its high baseline detection rate of 80.35%."
evidence = "deterministic transformation"
reports = ["rq1"]

[[claim.check]]
kind = "extent"
report = "rq1"
table = "tab-mutation-score-improvements"
where = { row_key = ["commons-utils:NAIVE_*", "commons-utils:IMPROVED_*"] }
column = "absolute_improvement"
min = "0.05"
max = "0.07"

[[claim.check]]
kind = "cell"
report = "rq1"
table = "tab-mutation-score-improvements"
where = { row_key = "commons-utils:INITIAL" }
column = "detected_of_covered_pct"
value = "80.35"

[[claim]]
id = "rq1-mutation-operators"
rq = "RQ1"
statement = "Improved excels at ConditionalsBoundary mutations (+2.55pp), while Naive performs better on Math mutations (+3.99pp versus +3.37pp)."
evidence = "deterministic transformation"
reports = ["rq1"]

[[claim.check]]
kind = "cell"
report = "rq1"
table = "tab-detections-per-mutator"
where = { mutator = "ConditionalsBoundary" }
column = "detected_diff_improved_200_tries"
value = "2.55"

[[claim.check]]
kind = "cell"
report = "rq1"
table = "tab-detections-per-mutator"
where = { mutator = "ConditionalsBoundary" }
column = "detected_diff_naive_200_tries"
value = "1.21"

[[claim.check]]
kind = "cell"
report = "rq1"
table = "tab-detections-per-mutator"
where = { mutator = "Math" }
column = "detected_diff_naive_200_tries"
value = "3.99"

[[claim.check]]
kind = "cell"
report = "rq1"
table = "tab-detections-per-mutator"
where = { mutator = "Math" }
column = "detected_diff_improved_200_tries"
value = "3.37"

