on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  gradle:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      # setup-gradle cleans its cache after the job with the runner's own Gradle,
      # which needs Java 17, while the build needs Java 8. Java 8 is set up second
      # so that it is the default until the last step.
      - name: Setup JDK 17 for the Gradle cache cleanup
        id: cleanup-jdk
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup JDK 8 with JavaFX
        uses: actions/setup-java@v6
        with:
          distribution: 'liberica'
          java-version: '8'
          java-package: 'jdk+fx'

      # v6 puts the cache under separate terms of use, so this stays on v5.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Execute Gradle build
        run: ./gradlew build

      - name: Hand Java 17 to the Gradle cache cleanup
        shell: bash
        run: echo "JAVA_HOME=${{ steps.cleanup-jdk.outputs.path }}" >> "$GITHUB_ENV"

  analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # setup-uv publishes no major tags since v8.
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3

      # uv stops looking for .python-version at analysis/, the project root, and then
      # takes the runner's system Python, for which locked packages may have no wheel.
      - name: Select the pinned Python
        run: echo "UV_PYTHON=$(cat .python-version)" >> "$GITHUB_ENV"

      - name: Setup Nix
        uses: DeterminateSystems/determinate-nix-action@v3.21.9

      # The hooks are the definition of formatting, lint and types, so CI runs
      # them rather than a second list that could disagree. `pre-push` stays out:
      # its DB-backed tests require registered evaluation state, not the focused
      # synthetic contract owned by postgres-contract.yml.
      - name: Run the commit hooks
        run: nix develop --command lefthook run pre-commit --all-files

      # Defined once for the whole workstation in the fleet input. Fails on an
      # invalid artifact and on a change archived with unfinished tasks.
      - name: Validate OpenSpec artifacts
        run: nix build --no-link ".#checks.$(nix eval --raw --impure --expr builtins.currentSystem).openspec"

      # No RepoReapers corpus here, so the `db` tests would skip rather than
      # run. Deselecting them keeps a skip from reading as a pass.
      - name: Run the analysis tests
        working-directory: analysis
        run: uv run python -m pytest -m "not db" --cov=src --cov-report=term-missing
