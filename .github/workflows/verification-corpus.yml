name: Verification corpus

# Deliberately not on pull_request. The corpus puts every fixture through the
# real pipeline and takes tens of minutes, so gating review on it would trade a
# fast signal for a slow one. Push filtering follows the executable owner
# boundary checked by the repository contract; manual runs remain available.
on:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/verification-corpus.yml'
      - 'scripts/verify-pipeline.sh'
      - 'scripts/run-verification-corpus.sh'
      - 'scripts/check-verification-corpus.sh'
      - 'scripts/corpus-registry'
      - 'scripts/lib/db-guard.sh'
      - 'scripts/lib/run-supervisor.sh'
      - 'scripts/lib/db-lifecycle.sh'
      - 'scripts/lib/psql.sh'
      - 'analysis/pyproject.toml'
      - 'analysis/uv.lock'
      - 'analysis/src/teralizer/__init__.py'
      - 'analysis/src/teralizer/config.py'
      - 'analysis/src/teralizer/corpora.py'
      - 'analysis/src/teralizer/report_basis.py'
      - 'build.gradle'
      - 'settings.gradle'
      - 'build-properties.xml'
      - 'gradlew'
      - 'gradle/wrapper/**'
      - '.gitmodules'
      - 'jpf-symbc'
      - 'src/**'
      - 'project-configs/verification.conf'
      - 'project-configs/verification/**'
      - 'verification/fixtures/**'
      - 'verification/golden/**'
  workflow_dispatch:
  # Catches weekly runner and dependency drift even when no owner path changes.
  schedule:
    - cron: '0 4 * * 1'

# Only a newer run for the same ref supersedes the result already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    # Successful runs take about 20 minutes; bound stalled setup and pipeline work.
    timeout-minutes: 35
    runs-on: ubuntu-latest
    services:
      postgres:
        # Must match the major version the goldens were produced under.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'liberica'
          java-version: '8'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      # The scripts reach the server over TCP through libpq, so the client has
      # to exist on PATH. Without one scripts/lib/psql.sh falls back to a
      # container that this job does not run.
      - name: Install the PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run the verification corpus
        run: scripts/verify-pipeline.sh
