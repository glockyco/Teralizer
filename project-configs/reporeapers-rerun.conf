# RepoReapers applicability rerun profile.
#
# Composed with a per-project config via the layered config loader, e.g.:
#   -Dteralizer.config=project-configs/reporeapers-rerun.conf,project-configs/replication/extended/project-N.conf
# (reference.conf supplies the remaining pipeline defaults; the per-project config supplies root-path.)
#
# Purpose: collect fresh applicability evidence -- filter causes and generalization failures --
# on the current implementation. Mutation scores are not relevant here, so PIT is skipped. A single
# IMPROVED variant is enough: the filter funnel (the dominant blocker) is variant-independent.
teralizer {
  database { name = "postgres_reporeapers_scratch" }

  pitest {
    enabled = false
  }

  generalizations {
    IMPROVED_100_TRIES {
      algorithm = "IMPROVED"
      jqwik { tries = 100 }
    }
  }
}
