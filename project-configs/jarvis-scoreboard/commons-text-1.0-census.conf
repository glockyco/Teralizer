teralizer {
  project {
    root-path = "data/jarvis-census/fixtures/commons-text-1.0-census"
    use-test-generation = false
    use-test-generalization = true
  }

  jpf {
    max-execution-time = 30
    max-path-condition-size = 100000
  }

  junit {
    # The fixture carries the full upstream suite, so EXECUTE_TESTS_ORIGINAL runs
    # thousands of tests under JaCoCo.
    max-execution-time = 1200
  }

  pitest {
    mutators = "DEFAULTS"
    # Tripwire, not a bound: a fired PIT timeout drops the whole fixture downstream.
    max-execution-time = 3600
  }

  generalizations {
    IMPROVED_100_TRIES {
      algorithm = "IMPROVED"
      jqwik { tries = 100 }
    }
  }
}
