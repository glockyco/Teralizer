teralizer {
  project {
    root-path = "data/jarvis-census/fixtures/commons-lang-3.5-census"
    use-test-generation = false
    use-test-generalization = true
  }

  jpf {
    max-execution-time = 30
    max-path-condition-size = 100000
  }

  junit {
    max-execution-time = 120
  }

  pitest {
    mutators = "DEFAULTS"
    max-execution-time = 1800  # 30 min; single-variant GENERALIZED PIT est. well under (INITIAL ran 50s)
  }

  generalizations {
    IMPROVED_100_TRIES {
      algorithm = "IMPROVED"
      jqwik { tries = 100 }
    }
  }
}
