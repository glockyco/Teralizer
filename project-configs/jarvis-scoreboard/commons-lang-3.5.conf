teralizer {
  project {
    root-path = "data/jarvis-scoreboard/fixtures/commons-lang-3.5"
    use-test-generation = false
    use-test-generalization = true
  }

  jpf {
    max-execution-time = 30
    max-path-condition-size = 100000
  }

  junit {
    max-execution-time = 120
  }

  pitest {
    mutators = "DEFAULTS"
    max-execution-time = 300
  }

  # IMPROVED only: the head-to-head reads IMPROVED_100, the tries sweep reads all three.
  generalizations {
    IMPROVED_100_TRIES {
      algorithm = "IMPROVED"
      jqwik { tries = 100 }
    }
    IMPROVED_200_TRIES {
      algorithm = "IMPROVED"
      jqwik { tries = 200 }
    }
    IMPROVED_1000_TRIES {
      algorithm = "IMPROVED"
      jqwik { tries = 1000 }
    }
  }
}
