teralizer {
  project {
    root-path = "data/jarvis-scoreboard/fixtures/commons-math-3.5"
    use-test-generation = false
    use-test-generalization = true
  }

  jpf {
    timeout { per-assertion = 30 }
    max-path-condition-size = 100000
  }

  junit {
    # original-initial keeps the paper's 120s base; generalized keeps the old inherited 3600s ceiling.
    timeout { original-initial = 120, generalized = 3600 }
  }

  pitest {
    mutators = "DEFAULTS"
    timeout { original-initial = 300, generalized = 300 }
  }

  # IMPROVED only: the head-to-head reads IMPROVED_100, the tries sweep reads all three.
  generalizations {
    IMPROVED_100_TRIES {
      algorithm = "IMPROVED"
      jqwik { tries = 100 }
    }
    IMPROVED_200_TRIES {
      algorithm = "IMPROVED"
      jqwik { tries = 200 }
    }
    IMPROVED_1000_TRIES {
      algorithm = "IMPROVED"
      jqwik { tries = 1000 }
    }
  }
}
