# Profile of the controlled generalization runs.
#
# replication/scripts/run.sh layers it under each config in generalization/, which names
# only the project. The variants are those that the configuration column of the
# controlled corpus records for every generalization run. reference.conf supplies the rest.
teralizer {
  generalizations {
    BASELINE {
      algorithm = "BASELINE"
      jqwik { tries = 1 }
    }
    NAIVE_10_TRIES {
      algorithm = "NAIVE"
      jqwik { tries = 10 }
    }
    NAIVE_50_TRIES {
      algorithm = "NAIVE"
      jqwik { tries = 50 }
    }
    NAIVE_200_TRIES {
      algorithm = "NAIVE"
      jqwik { tries = 200 }
    }
    IMPROVED_10_TRIES {
      algorithm = "IMPROVED"
      jqwik { tries = 10 }
    }
    IMPROVED_50_TRIES {
      algorithm = "IMPROVED"
      jqwik { tries = 50 }
    }
    IMPROVED_200_TRIES {
      algorithm = "IMPROVED"
      jqwik { tries = 200 }
    }
  }
}
