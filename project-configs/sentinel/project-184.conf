# Tier-2 sentinel subset: five stable real spike projects for ~15-minute verification
# of real-world messiness that tiny fixtures cannot fake. These projects were
# bit-identical across the 2026-07-03/04 spike-run census and jointly cover:
# large stable suite; boxed converters plus MIN_VALUE seeds; display-name reports
# plus boolean-in-PC; all-refused NULL_CONCRETE; and the old-surefire floor.
# Deliberately excluded flaky evaluation-only projects: kouchat, gedcom4j,
# xenqtt, uaicriteria, and sparkey.
teralizer {
  project {
    root-path = "projects/github_com_cjmcgraw_MarkupTagScanner"
  }
}
