# Verification fixture-corpus profile.
#
# Compose with one fixture config, e.g.:
#   -Dteralizer.config=project-configs/verification.conf,project-configs/verification/fixture-symbolic-int.conf
# reference.conf supplies the pipeline ceilings; fixture configs supply only root-path.
# PIT is skipped because Tier 1 verifies full extraction/generalization/jqwik behavior, not mutation scores.
teralizer {
  pitest {
    enabled = false
  }

  generalizations {
    IMPROVED_100_TRIES {
      algorithm = "IMPROVED"
      jqwik { tries = 100 }
    }
  }
}
