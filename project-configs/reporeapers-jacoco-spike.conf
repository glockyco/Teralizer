# JaCoCo-reduction diagnostic spike: full pipeline, reduction on, PIT off, IMPROVED_200_TRIES.
# Reproduces the reduction-phase JaCoCo coverage-collection failures on the current pipeline to
# separate fixable pipeline causes from genuinely un-instrumentable projects, before the full PIT
# collection. Composed with a per-project config the same way reporeapers-rerun.conf is.
teralizer {
  pitest {
    enabled = false
  }

  generalizations {
    IMPROVED_200_TRIES {
      algorithm = "IMPROVED"
      jqwik { tries = 200 }
    }
  }
}
