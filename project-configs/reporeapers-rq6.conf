# RepoReapers RQ6 full-pipeline profile.
#
# Composed with a per-project config via the layered config loader, e.g.:
#   -Dteralizer.config=project-configs/reporeapers-rq6.conf,project-configs/replication/extended/project-N.conf
# (reference.conf supplies the remaining pipeline defaults; the per-project config supplies root-path.)
#
# Purpose: collect the RQ6 five-stage funnel through Stage 5 (Test Suite Reduction) on the current
# pipeline. Unlike the applicability rerun, mutation is the point here: final_usable requires PIT
# collection, so PIT is enabled. ORIGINAL-stage PIT stays off (no analysis consumer, and its JaCoCo
# step runs first in reduction), so Stage-5 diagnostics come from INITIAL and GENERALIZED mutation.
#
# Timeout budgets come from reference.conf's unified policy (junit 300/300/1800, pitest 3600) -- no
# per-config overrides. The 3600 s PIT cap is generous for RepoReapers, whose PIT durations sit far
# below the census projects the cap was calibrated against.
teralizer {
  database { name = "postgres_reporeapers_scratch" }

  pitest {
    enabled = true
  }

  generalizations {
    IMPROVED_200_TRIES {
      algorithm = "IMPROVED"
      jqwik { tries = 200 }
    }
  }
}
