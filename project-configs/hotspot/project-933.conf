# Concretization-census hotspot: antiaction-common-json, run against its local checkout.
# antiaction's THROWN-oracle generalizations all refuse on concretization_events > 0
# (String inputs entering unmodeled JSON parsing), so it is the single-project hotspot leg
# of the census. Composed with the reporeapers-rerun profile via the layered config loader.
teralizer {
  project {
    root-path = "projects/github_com_nclarkekb_antiaction-common-json"
  }
}
