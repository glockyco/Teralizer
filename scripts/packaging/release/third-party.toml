# Origins of the shipped projects that the real-world checkout map does not cover.
#
# The release builder combines each entry with the license that licensee detects
# in the packaged files and writes the third-party record of every project into
# its component. `upstream` names the repositories whose LICENSE and NOTICE files
# the release retains next to the projects, at `revision` or, where the project
# records none, at the revision the fetch pinned in third-party-upstream.tsv.

format = "teralizer-third-party-sources"
format_version = 1

[[project]]
component = "projects-controlled"
paths = [
    "projects/EqBench",
    "projects/eqbench-es-default-1s",
    "projects/eqbench-es-default-10s",
    "projects/eqbench-es-default-60s",
]
origin = "https://github.com/glockyco/EqBench.git"
revision = "de19c3efd11f9b66bd13ce4704169efc73bdaaf3"
note = "Fork of https://github.com/shrBadihi/EqBench with the EqBench programs as one Maven project. The generated tests under src/test of the -es- projects were produced by EvoSuite for this study."

[[project]]
component = "projects-controlled"
paths = [
    "projects/commons-utils",
    "projects/commons-utils-es-default-1s",
    "projects/commons-utils-es-default-10s",
    "projects/commons-utils-es-default-60s",
]
origin = "https://github.com/apache"
license = "Apache-2.0"
license_evidence = "Apache Commons origin of every class in export.csv, and the Apache license header in all of them but one"
upstream = [
    "commons-bcel", "commons-codec", "commons-collections", "commons-compress",
    "commons-configuration", "commons-geometry", "commons-imaging", "commons-io",
    "commons-jcs", "commons-jexl", "commons-jxpath", "commons-lang", "commons-math",
    "commons-net", "commons-numbers", "commons-rng", "commons-validator",
]
note = "Utility classes and their tests from the Apache Commons repositories that export.csv lists, fetched from their default branches without a recorded revision. The generated tests in the -es- projects were produced by EvoSuite for this study."

