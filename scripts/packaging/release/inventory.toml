# Release input inventory.
#
# Every input the release can draw bytes from has one entry here. An input either
# supplies payload to exactly one component or has an explicit non-payload
# disposition with the reason the release does not need its bytes.
#
# Ambient entries cover every ignored or untracked path of a source checkout. They
# prove that no required byte lives only in author state. The release builder never
# reads an ambient path unless an input names it as its source.
#
# A corpus-package path is a semantic corpus id, which the corpus package manifest
# resolves to its dump, or the manifest itself. An evaluation-host path is relative
# to the directory that holds the evaluation checkouts on that host. The content
# identity in the reconstruction inventory, not this path, identifies the bytes.
#
# Check with: uv run --directory analysis python -m teralizer.release inventory

# Ambient roots whose children receive separate dispositions.
expand = ["data/", "data/jarvis-census/", "data/jarvis-scoreboard/"]

# --------------------------------------------------------------------------------
# Inputs
# --------------------------------------------------------------------------------

[[input]]
id = "source-tree"
location = "git-tree"
disposition = "payload"
component = "core"
reason = "Committed source, configuration, documentation, reference outputs and compact report inputs at the release revision. Gitlinks and LFS pointers are resolved by the inputs below."

[[input]]
id = "evosuite-jar"
location = "git-lfs"
path = "src/main/resources/evosuite/evosuite-1.2.0.jar"
disposition = "payload"
component = "core"
reason = "The generation stage runs EvoSuite from this jar. The tree holds only an LFS pointer."

[[input]]
id = "reference-figures"
location = "git-lfs"
path = "analysis/output/original/figures/*.pdf"
disposition = "payload"
component = "core"
reason = "Reference figures of the registered report run. The tree holds only LFS pointers."

[[input]]
id = "jpf-symbc"
location = "submodule"
path = "jpf-symbc"
disposition = "payload"
component = "core"
reason = "Symbolic PathFinder fork that the Java pipeline builds and runs. The tree holds only a gitlink."

[[input]]
id = "jpf-core"
location = "submodule"
path = "jpf-symbc/jpf-core"
disposition = "payload"
component = "core"
reason = "Java PathFinder core that jpf-symbc builds against. Its gitlink lives inside jpf-symbc and its URL needs SSH access, so the release materializes it."

[[input]]
id = "eqbench"
location = "submodule"
path = "projects/EqBench"
disposition = "payload"
component = "projects-controlled"
reason = "Origin of the three EqBench-ES projects, which EvoSuite generated their tests into."

[[input]]
id = "controlled-projects"
location = "checkout-ambient"
path = "projects/{commons-utils,commons-utils-es-default-1s,commons-utils-es-default-10s,commons-utils-es-default-60s,eqbench-es-default-1s,eqbench-es-default-10s,eqbench-es-default-60s}"
disposition = "payload"
component = "projects-controlled"
reason = "The seven project roots of the controlled corpus, including the EvoSuite tests whose stochastic generation cannot be repeated byte for byte. Teralizer outputs, build outputs and IDE files are excluded. The corpus test paths bound the selection."

[[input]]
id = "corpus-controlled"
location = "corpus-package"
path = "controlled"
disposition = "payload"
component = "corpus-controlled"
reason = "Verified dump of the controlled corpus."

[[input]]
id = "corpus-real-world"
location = "corpus-package"
path = "real-world"
disposition = "payload"
component = "corpus-real-world"
reconstruction_source = "version-seven-database-export"
reason = "Verified dump of the real-world corpus. Its bytes are the version-seven database export of the reconstruction inventory."

[[input]]
id = "corpus-jarvis-scenarios"
location = "corpus-package"
path = "jarvis-scenarios"
disposition = "payload"
component = "corpus-jarvis-scenarios"
reason = "Verified dump of the JARVIS scenarios corpus."

[[input]]
id = "corpus-jarvis-benchmark"
location = "corpus-package"
path = "jarvis-benchmark"
disposition = "payload"
component = "corpus-jarvis-benchmark"
reason = "Verified dump of the JARVIS benchmark corpus."

[[input]]
id = "corpus-manifest"
location = "corpus-package"
path = "manifest.json"
disposition = "payload"
component = "core"
reason = "Identity, provenance and checksums of the four corpus dumps. Each corpus component carries its own entry."

[[input]]
id = "jarvis-scoreboard-fixtures"
location = "checkout-ambient"
path = "data/jarvis-scoreboard/fixtures/{commons-lang-2017-02-01,commons-math-2017-02-01}"
disposition = "payload"
component = "projects-jarvis-scoreboard"
reason = "The measured scorecard fixture roots of the jarvis-scenarios corpus: pom.xml and src/ only. Generated _*_Generalized_* and _*_Driver_* sources, data/, target/ and Teralizer POMs are pipeline output and stay out. Preparation from the pinned commits reproduces the payload except that the measured copies of some upstream files have CRLF line endings."

[[input]]
id = "jarvis-census-fixtures"
location = "checkout-ambient"
path = "data/jarvis-census/fixtures/*-2017-02-01-census"
disposition = "payload"
component = "projects-jarvis-census"
reason = "The twelve measured census fixture roots of the jarvis-benchmark corpus: pom.xml and src/ only. Generated _*_Generalized_* and _*_Driver_* sources, data/, target/ and Teralizer POMs are pipeline output and stay out. Preparation from the pinned commits reproduces the payload except that the measured copies of some upstream files have CRLF line endings."

[[input]]
id = "jarvis-value-logs"
location = "checkout-ambient"
path = "data/jarvis-{scoreboard,census}/fixtures/**/*.values.tsv"
selector = "jarvis-value-facts"
disposition = "payload"
component = "core"
reason = "The value logs that jarvis-value-facts.json binds by count and aggregate checksum, at their repository-relative paths. Only logs selected by the two JARVIS corpora are included."

[[input]]
id = "jarvis-run-ledgers"
location = "checkout-ambient"
path = "data/jarvis-{scoreboard,census}/{PROVENANCE.md,status.tsv,run-logs}"
disposition = "payload"
component = "core"
reason = "Fixture provenance, run status and run logs of the scorecard and census collection. The census status ledger is the completion evidence for the jarvis-benchmark corpus."

[[input]]
id = "cut-pvc-raw-captures"
location = "checkout-ambient"
path = "data/cut-pvc-capture/raw"
disposition = "payload"
component = "core"
reason = "Raw per-test CUT-PVC captures that analysis/data/jarvis-cut-values/cut_values.tsv aggregates, from a rerun of scripts/run-cut-pvc-capture.sh on the pinned Commons Lang and Commons Math checkouts whose aggregate equals the committed file byte for byte."

[[input]]
id = "jarvis-source-cache"
location = "checkout-ambient"
path = "data/jarvis-source-cache"
disposition = "retrieval"
reason = "Upstream Apache Commons clones at the pinned commits, shared by the fixture preparer and the CUT-PVC capture. Both clone them again from the repository URLs and commits recorded in their scripts."

[[input]]
id = "reporeapers-facts-record"
location = "evaluation-host"
path = "test-generalization/corpus-exports/real-world.complete/facts.tsv"
disposition = "payload"
component = "core"
release_path = "data/reporeapers-rerun-v7/export-facts.tsv"
reconstruction_source = "version-seven-facts-record"
reason = "Completion facts of the version-seven export."

[[input]]
id = "reporeapers-run-status"
location = "evaluation-host"
path = "test-generalization-dev/data/reporeapers-rerun-v7/status.tsv"
disposition = "payload"
component = "core"
release_path = "data/reporeapers-rerun-v7/status.tsv"
reconstruction_source = "version-seven-run-status"
reason = "Per-project exit status of the version-seven run."

[[input]]
id = "reporeapers-project-logs"
location = "evaluation-host"
path = "test-generalization-dev/data/reporeapers-rerun-v7/run-logs"
disposition = "payload"
component = "core"
release_path = "data/reporeapers-rerun-v7/run-logs"
reconstruction_source = "version-seven-project-logs"
reason = "Per-project pipeline logs of the version-seven run. RQ6 cause reconstruction reads them."

[[input]]
id = "reporeapers-done-markers"
location = "evaluation-host"
path = "test-generalization-dev/data/reporeapers-rerun-v7/done"
disposition = "payload"
component = "core"
release_path = "data/reporeapers-rerun-v7/done"
reason = "One completion marker per real-world project. Report runs check them against the configurations, the run status and the corpus before they read the real-world corpus."

[[input]]
id = "reporeapers-configurations"
location = "git-tree"
path = "project-configs/replication/extended"
disposition = "duplicate"
reconstruction_source = "version-seven-configurations"
reason = "Project configurations of the version-seven run. The source-tree input already ships them."

[[input]]
id = "reporeapers-checkout-revisions"
location = "evaluation-host"
path = "test-generalization-dev/projects/github_com_*"
selector = "checkout HEAD and origin URL of every corpus project"
disposition = "payload"
component = "core"
release_path = "data/reporeapers-rerun-v7/checkout-revisions.tsv"
reconstruction_source = "version-seven-project-checkouts"
reason = "Checkout revision and origin of every real-world project. The reconstruction inventory kept only a digest of this map, whose serialization the repository does not record, so the release ships the map itself and checks it against the corpus revisions."

[[input]]
id = "reporeapers-project-checkouts"
location = "evaluation-host"
path = "test-generalization-dev/projects/github_com_*"
selector = "real-world-git-revisions"
disposition = "payload"
component = "projects-real-world-full"
reason = "Every real-world project as the pipeline's checkout wrote it: the recorded revision replayed through MeasuredCheckout.java with the evaluation host's checkout settings, and the deviations that real-world-checkout-deviations.tsv declares. Each project keeps its own license, and the third-party records state where none was found."

[[input]]
id = "reporeapers-project-sample"
location = "evaluation-host"
path = "test-generalization-dev/projects/github_com_*"
selector = "real-world-sample"
disposition = "payload"
component = "projects-real-world-sample"
reason = "The projects that real-world-sample.txt lists, from the same export. It is the one deliberate overlap: every sample project equals its copy in projects-real-world-full."

[[input]]
id = "reporeapers-run-artifacts"
location = "evaluation-host"
path = "test-generalization-dev/data/reporeapers-rerun-v7"
disposition = "non-payload"
reconstruction_source = "version-seven-run-artifacts"
reason = "Generated tests, build outputs and tool reports of the version-seven run. The corpus records the facts the reports read. Report reproduction does not need these bytes, and the reconstruction inventory records their content identity."

[[input]]
id = "reporeapers-project-mapping"
location = "corpus-package"
path = "real-world"
disposition = "duplicate"
reconstruction_source = "version-seven-project-mapping"
reason = "The project-to-revision mapping is a query on the real-world corpus, which corpus-real-world already ships."

[[input]]
id = "paper"
location = "external"
path = "https://doi.org/10.48550/arXiv.2512.14475"
disposition = "retrieval"
reason = "The paper the release accompanies. The release cites it by persistent identifier and does not copy its text, whose rights the publisher may hold."

[[input]]
id = "jarvis-publication"
location = "external"
path = "https://doi.org/10.1007/978-3-319-73721-8_19"
disposition = "retrieval"
reason = "The JARVIS paper whose Table 2 values RQ0 compares against. replication/RQ0.md cites it. The release copies only the compared values."

[[input]]
id = "container-images"
location = "external"
path = "registry images named by Dockerfile and Compose files"
disposition = "retrieval"
reason = "Base and service images. The release pins each by digest and ships the Dockerfiles and Compose files in the source tree instead of image archives."

[[input]]
id = "upstream-licenses-controlled"
location = "external"
path = "https://raw.githubusercontent.com/apache/<repository>/<revision>/{LICENSE,NOTICE}*"
selector = "commons-utils origins in third-party.toml at the revisions of third-party-upstream.tsv"
disposition = "payload"
component = "projects-controlled"
reason = "The Apache License and NOTICE files of the Apache Commons repositories that commons-utils takes its classes from. The project carries no license file, and the Apache License requires both with redistributed code."

[[input]]
id = "upstream-licenses-scoreboard"
location = "external"
path = "https://raw.githubusercontent.com/apache/<repository>/<revision>/{LICENSE,NOTICE}*"
selector = "scorecard fixtures in third-party.toml at their pinned revisions"
disposition = "payload"
component = "projects-jarvis-scoreboard"
reason = "The Apache License and NOTICE files of the two scorecard fixtures' upstream revisions. The fixture payload is the POM and the sources, which carry neither."

[[input]]
id = "upstream-licenses-census"
location = "external"
path = "https://raw.githubusercontent.com/apache/<repository>/<revision>/{LICENSE,NOTICE}*"
selector = "census fixtures in third-party.toml at their pinned revisions"
disposition = "payload"
component = "projects-jarvis-census"
reason = "The Apache License and NOTICE files of the twelve census fixtures' upstream revisions. The fixture payload is the POM and the sources, which carry neither."

# --------------------------------------------------------------------------------
# Ambient checkout paths
# --------------------------------------------------------------------------------

[[ambient]]
paths = [".env"]
disposition = "sensitive"
reason = "Local database credentials. The release ships .env.example."

[[ambient]]
paths = [".direnv/", ".gradle/", "analysis/.venv/", "analysis/.pytest_cache/", "analysis/.ruff_cache/", "analysis/.coverage", "analysis/src/teralizer_analysis.egg-info/", "*__pycache__/", "*.DS_Store", "*/._*", "._*", "*.jqwik-database", ".jqwik-database"]
disposition = "cache"
reason = "Tool caches, virtual environments and operating-system metadata."

[[ambient]]
paths = ["build/*/", "analysis/build/", "analysis/output/verify/", "analysis/analysis/", "tools/cut-pvc-capture/target/", "tools/cut-pvc-capture/dependency-reduced-pom.xml"]
disposition = "build-output"
reason = "Outputs of the Gradle build, of the capture agent's Maven build and of report runs. The release regenerates them from source and verifies the report outputs against the committed reference outputs."

[[ambient]]
paths = ["projects/example-*/*"]
disposition = "build-output"
reason = "Residue of local pipeline runs on the example projects. The committed example sources are in the source tree."

[[ambient]]
paths = ["verification/fixtures/*"]
disposition = "build-output"
reason = "Residue of verification-corpus runs. The driver regenerates it and the committed fixtures and golden files are in the source tree."

[[ambient]]
paths = ["project-configs/verification/._*"]
disposition = "cache"
reason = "Operating-system metadata."

[[ambient]]
paths = ["logs/", "data/verification/", "data/detached/"]
disposition = "scratch"
reason = "Local run logs, verification run roots and detached-process records. data/detached holds a superseded census completion marker that no workflow reads."

[[ambient]]
paths = ["replication/datasets/"]
disposition = "unrelated"
reason = "Database dumps of the first artifact version. The corpus package supersedes them."

[[ambient]]
paths = ["projects/commons-utils/", "projects/commons-utils-es-default-1s/", "projects/commons-utils-es-default-10s/", "projects/commons-utils-es-default-60s/", "projects/eqbench-es-default-1s/", "projects/eqbench-es-default-10s/", "projects/eqbench-es-default-60s/"]
disposition = "input"
inputs = ["controlled-projects"]
reason = "Source of the controlled project payload."

[[ambient]]
paths = ["projects/github_com_*/"]
disposition = "unrelated"
reason = "Local placeholders of real-world projects. The real-world sources come from the evaluation host."

[[ambient]]
paths = ["data/jarvis-scoreboard/fixtures/", "data/jarvis-census/fixtures/"]
disposition = "input"
inputs = ["jarvis-scoreboard-fixtures", "jarvis-census-fixtures", "jarvis-value-logs"]
reason = "Source of the JARVIS fixture payloads and of the selected value logs. Fixture roots outside the two corpora are older census runs."

[[ambient]]
paths = ["data/jarvis-scoreboard/PROVENANCE.md", "data/jarvis-census/PROVENANCE.md", "data/jarvis-census/status.tsv", "data/jarvis-census/run-logs/"]
disposition = "input"
inputs = ["jarvis-run-ledgers"]
reason = "Source of the JARVIS run ledgers."

[[ambient]]
paths = ["data/jarvis-source-cache/"]
disposition = "input"
inputs = ["jarvis-source-cache"]
reason = "Upstream clones for fixture preparation and CUT-PVC capture."

[[ambient]]
paths = ["data/jarvis-scoreboard/source-cache/"]
disposition = "unrelated"
reason = "Upstream clones from before the fixture preparer moved its cache to data/jarvis-source-cache. Their checkouts carry CRLF line endings that the measured fixtures inherited."

[[ambient]]
paths = ["data/cut-pvc-capture/"]
disposition = "input"
inputs = ["cut-pvc-raw-captures"]
reason = "Work directory of the CUT-PVC capture. Only its raw captures enter the release. The copied checkouts beside them are build scratch."

[[ambient]]
paths = ["data/jarvis-scoreboard/commons-*/", "data/jarvis-census/commons-*/", "data/jarvis-scoreboard/*.log"]
disposition = "unrelated"
reason = "Working run roots and refresh logs of the JARVIS runs. The two corpora and the selected value logs carry every fact the reports read."

[[ambient]]
paths = ["data/reporeapers-rerun-v7/", "data/reporeapers-rerun-v7-local/"]
disposition = "unrelated"
reason = "Local copies of the version-seven status ledger and of a partial local rerun. The release takes RepoReapers evidence from the evaluation host."

# --------------------------------------------------------------------------------
# Report file inputs
# --------------------------------------------------------------------------------
#
# Every FileInputSpec of a registered report has one entry. "regenerable" means the
# producer recreates the committed bytes from the components in `needs`.
# "frozen" means the release ships the file for inspection only and the reason says
# which evidence is missing for regeneration.

[[report_input]]
path = "analysis/data/report-inputs/jarvis-value-facts.json"
status = "regenerable"
producer = "python -m teralizer.eval.evidence jarvis-values"
needs = ["core", "corpus-jarvis-scenarios", "corpus-jarvis-benchmark"]
reason = "The producer reads both JARVIS corpora and the selected value logs in core."

[[report_input]]
path = "analysis/data/report-inputs/reporeapers-output-directories-population.json"
status = "regenerable"
producer = "python -m teralizer.eval.evidence reporeapers-output-directories"
needs = ["core", "corpus-real-world"]
reason = "The producer queries the real-world corpus and binds the dump identity from the reconstruction inventory."

[[report_input]]
path = "analysis/data/jarvis-cut-values/cut_values.tsv"
status = "regenerable"
producer = "python -m teralizer.cut_pvc aggregate data/cut-pvc-capture/raw"
needs = ["core"]
reason = "The producer aggregates the raw captures in core. Repeating the capture itself is collection: scripts/run-cut-pvc-capture.sh runs the JARVIS Table 2 tests on the pinned checkouts with the capture agent."

[[report_input]]
path = "analysis/data/report-inputs/project-source-facts.json"
status = "frozen"
producer = "python -m teralizer.eval.evidence project-sources --projects-root <projects>"
needs = ["core", "corpus-controlled", "corpus-real-world", "projects-controlled", "projects-real-world-full"]
reason = "The producer counts source files of the controlled projects and of every eligible real-world project. The release can ship real-world sources only where their license permits it, so only the controlled rows can be recomputed from the release."

[[report_input]]
path = "analysis/data/report-inputs/reporeapers-reconstruction-inventory.json"
status = "frozen"
producer = "python -m teralizer.eval.evidence.reporeapers_reconstruction inventory <specification> <output>"
needs = ["core"]
reason = "Content identities of the version-seven evidence on the evaluation host. Most of that evidence is in the release, but the run artifacts are not, so the inventory cannot be recomputed from it."

[[report_input]]
path = "analysis/data/report-inputs/reporeapers-reconstruction-audit.json"
status = "frozen"
producer = "manual review recorded with python -m teralizer.eval.evidence.reporeapers_reconstruction"
needs = ["core"]
reason = "Observation-only reconstruction with manual review of the version-seven failures. The release ships the audit for inspection, and its validator checks it against the inventory."
